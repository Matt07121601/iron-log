<script>
/* ============================= STORAGE BACKEND (Firebase Firestore) ============================= */
// Claude's built-in window.storage requires every viewer to be on a paid Claude plan.
// This app instead uses Firebase Firestore (free Spark plan, no card required) so it
// works for the coach AND every client, on any device, with or without a Claude account.
const firebaseConfig = {
  apiKey: "AIzaSyD0kGUjBcHXGg9er_1n9Yb0iSc7Vlgl8EI",
  authDomain: "ironlog-6c0ff.firebaseapp.com",
  projectId: "ironlog-6c0ff",
  storageBucket: "ironlog-6c0ff.firebasestorage.app",
  messagingSenderId: "775990042723",
  appId: "1:775990042723:web:5359ccadd1de8eac161856"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

window.storage = {
  get: async (key)=>{
    try{
      const snap = await db.collection('kv').doc(key).get();
      if(!snap.exists) return null;
      return {key, value: snap.data().value, shared:true};
    }catch(e){ return null; }
  },
  set: async (key, value)=>{
    try{
      await db.collection('kv').doc(key).set({value});
      return {key, value, shared:true};
    }catch(e){ return null; }
  },
  delete: async (key)=>{
    try{
      await db.collection('kv').doc(key).delete();
      return {key, deleted:true, shared:true};
    }catch(e){ return null; }
  },
  list: async (prefix)=>{
    try{
      const p = prefix || '';
      const snap = await db.collection('kv')
        .where(firebase.firestore.FieldPath.documentId(), '>=', p)
        .where(firebase.firestore.FieldPath.documentId(), '<', p + '\uf8ff')
        .get();
      const keys = snap.docs.map(d=>d.id);
      return {keys, prefix, shared:true};
    }catch(e){ return null; }
  }
};

/* ============================= MULTI-CLIENT SESSION ============================= */
const LEGACY_KEY_PROFILE = 'profile-and-program';
const LEGACY_KEY_LOGS = 'workout-nutrition-logs';
function clientDataKey(id){ return `client-${id}-data`; }

let session = { role:null, clientId:null, clientName:null, viewingAsCoach:false };
let roster = [];             // only ever populated AFTER coach authenticates — never pre-loaded
let coachConfigured = false; // safe to know publicly: "has a coach set themselves up", not the code itself
let bootReady = false;
let gateError = null;
let gateBusy = false;
let gateSubmitError = null;
let gateSetupError = null;
let justAddedClient = null;
let backupStatus = 'idle';
let checkinStatus = 'idle';
let checkinDraft = null;

function genCode(len=6){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I
  let out='';
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
// SHA-256 hash of a code, used so we only ever look up "does this exact guess match something"
// rather than loading the full list of valid codes into memory for anyone browsing.
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Attempts to log in as coach. Only fetches a single hash-keyed marker for THIS guess —
// never loads the actual coach code or any client data.
async function tryCoachLogin(code){
  try{
    const hash = await sha256Hex('coach:'+code);
    const r = await window.storage.get('coach-auth-'+hash, true);
    return !!(r && r.value);
  }catch(e){ return false; }
}
// Attempts to log in as a client. Only fetches a single hash-keyed marker for THIS guess,
// which resolves to that one client's internal id — a wrong guess reveals nothing about
// any other client, and correct guesses never expose other clients' codes or data.
async function tryClientLogin(code){
  try{
    const hash = await sha256Hex('client:'+code);
    const r = await window.storage.get('client-code-'+hash, true);
    return (r && r.value) ? r.value : null;
  }catch(e){ return null; }
}
// Only called once the coach has already authenticated — safe to load the full roster here.
async function loadRoster(){
  try{
    const r = await window.storage.get('roster', true);
    if(r && r.value) roster = JSON.parse(r.value);
  }catch(e){ roster = []; }
}
async function saveRoster(){
  try{ await window.storage.set('roster', JSON.stringify(roster), true); }catch(e){}
}

/* ============================= STATE ============================= */
let state = {
  onboarded:false,
  step:0,
  profile:{
    name:'', gender:'', ageYears:'', ageMonths:'',
    weightKg:'', heightFt:'', heightIn:'', bodyFatPct:'', bodyFatSource:'manual', bodyType:'', weightUnit:'kg',
    goal:'', work:'', activityLevel:'', daysPerWeek:4, sessionMins:60, trainingTime:'AM',
    equipment:'', equipmentNotes:'', dietaryRestrictions:'', dietaryLikes:'', dietaryDislikes:''
  },
  photos:{front:null, side:null, rear:null, target:null},
  analysis:{status:'idle', result:null},
  program:null,
  targets:null,
  view:'dashboard',
  activeDayIndex:0,
  quoteQueue:[],
  showingQuoteFor:null,
  foodSearch:{mode:'search', query:'', results:[], selected:null, qty:100, scanError:null, usedFallback:false},
  logs:{
    workouts:{},      // key: 'dayName-YYYY-MM-DD' -> {date, dayName, exercises:{exName:[{weight,reps,rpe,done}]}}
    bodyweight:[],    // [{date, weightKg}]

  }
};

let saveTimeout = null;
function queueSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveAll, 500);
}
async function saveAll(){
  if(!session.clientId) return;
  try{
    await window.storage.set(clientDataKey(session.clientId), JSON.stringify({
      profile:state.profile, program:state.program, targets:state.targets,
      analysis:state.analysis, onboarded:state.onboarded, photos:state.photos,
      logs:state.logs
    }), true);
  }catch(e){ console.error('Save failed', e); }
}
function resetAllData(){

}
function showResetModal(){
  if($('resetModal')) return;
  const overlay = el(`
    <div id="resetModal" class="fixed inset-0 z-[70] bg-black/70 flex items-center justify-center px-4">
      <div class="card p-6 max-w-sm w-full">

}
async function doReset(){
  if(session.clientId){
    try{ await window.storage.delete(clientDataKey(session.clientId), true); }catch(e){}
  }
  clearTimeout(saveTimeout);
  clearInterval(Timer.interval);
  $('timerBar') && $('timerBar').classList.add('hidden');
  chartInstances.forEach(c=>{ try{ c.destroy(); }catch(e){} });
  chartInstances = [];
  Object.assign(state, freshClientState());
  render();
}
function freshClientState(){
  return {
    onboarded:false, step:0,
    profile:{
      name:'', gender:'', ageYears:'', ageMonths:'',
      weightKg:'', heightFt:'', heightIn:'', bodyFatPct:'', bodyFatSource:'manual', bodyType:'', weightUnit:'kg',
      goal:'', work:'', activityLevel:'', daysPerWeek:4, sessionMins:60, trainingTime:'AM',
      equipment:'', equipmentNotes:'', dietaryRestrictions:'', dietaryLikes:'', dietaryDislikes:''
    },
    photos:{front:null, side:null, rear:null, target:null},
    analysis:{status:'idle', result:null},
    program:null, targets:null, view:'dashboard', activeDayIndex:0,
    quoteQueue:[], showingQuoteFor:null,
    foodSearch:{mode:'search', query:'', results:[], selected:null, qty:100, scanError:null, usedFallback:false},
    logs:{workouts:{}, bodyweight:[], food:{}}
  };
}
async function loadClientState(id){
  Object.assign(state, freshClientState());
  try{
    const d = await window.storage.get(clientDataKey(id), true);
    if(d && d.value) Object.assign(state, JSON.parse(d.value));
  }catch(e){ /* new client, no data yet */ }
}

/* ---- App bootstrap: only checks a safe public marker + attempts legacy migration, then shows gate ---- */
async function loadAll(){
  try{
    const m = await window.storage.get('coach-configured', true);
    coachConfigured = !!(m && m.value);
  }catch(e){ coachConfigured = false; }
  await tryMigrateLegacyData();
  bootReady = true;
  render();
}
async function tryMigrateLegacyData(){
  if(coachConfigured) return; // multi-client mode already active; don't touch a stray personal blob
  try{
    const already = await window.storage.get('legacy-migrated');
    if(already && already.value) return;
  }catch(e){ /* not migrated yet, continue */ }
  try{
    const legacy = await window.storage.get(LEGACY_KEY_PROFILE);
    if(legacy && legacy.value){
      const parsed = JSON.parse(legacy.value);
      if(parsed.onboarded){
        const name = (parsed.profile && parsed.profile.name) || 'My Profile';
        const code = genCode(6);
        const id = genCode(10);
        const hash = await sha256Hex('client:'+code);
        let existingRoster = [];
        try{ const r = await window.storage.get('roster', true); if(r && r.value) existingRoster = JSON.parse(r.value); }catch(e){}
        existingRoster.push({id, name, code, createdAt: todayISO()});
        await window.storage.set('roster', JSON.stringify(existingRoster), true);
        await window.storage.set('client-code-'+hash, id, true);
        let legacyLogs = {workouts:{}, bodyweight:[], food:{}};
        try{
          const ll = await window.storage.get(LEGACY_KEY_LOGS);
          if(ll && ll.value) legacyLogs = JSON.parse(ll.value);
        }catch(e){}
        await window.storage.set(clientDataKey(id), JSON.stringify(Object.assign({}, parsed, {logs:legacyLogs})), true);
        gateError = `Found your existing data from before multi-client mode — imported as client "${name}" (code ${code}). Set your coach code below to see them in your dashboard.`;
      }
    }
  }catch(e){ /* nothing to migrate */ }
  try{ await window.storage.set('legacy-migrated', 'true'); }catch(e){}
}

/* ============================= UTIL ============================= */
const $ = (id)=>document.getElementById(id);
const todayISO = ()=> new Date().toISOString().slice(0,10);
const fmt1 = (n)=> Math.round(n*10)/10;
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

/* ============================= GENDER ACCENT THEME ============================= */
// Applied only once a client has actively selected a gender — before that, the app
// stays on the neutral chalk-gold default (see profile.gender initial value: '').
const THEMES = {
  default: { chalk:'#E8C547', chalkDim:'#8A7A33', chalkLight:'#F5DE7E', chalkText:'#1B1B1E', chalkHover:'#F0D566', rgb:'232,197,71' },
  male:    { chalk:'#4169E1', chalkDim:'#2C3E8C', chalkLight:'#93A9F2', chalkText:'#F3F2EC', chalkHover:'#5578E8', rgb:'65,105,225' },
  female:  { chalk:'#E0218F', chalkDim:'#7A1050', chalkLight:'#F27FC0', chalkText:'#F3F2EC', chalkHover:'#EA4CA5', rgb:'224,33,143' }
};
function currentTheme(){
  return THEMES[state.profile.gender] || THEMES.default;
}
function applyTheme(){
  const t = currentTheme();
  const s = document.documentElement.style;
  s.setProperty('--chalk', t.chalk);
  s.setProperty('--chalk-dim', t.chalkDim);
  s.setProperty('--chalk-light', t.chalkLight);
  s.setProperty('--chalk-text', t.chalkText);

}
function resizeImageFile(file, maxDim=640){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w=maxDim; }
        else if(h>maxDim){ w = Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================= CALCULATIONS ============================= */
const ACTIVITY_MULT = {
  'Sedentary':1.2, 'Light':1.375, 'Moderate':1.55, 'Heavy':1.725, 'Athlete':1.9
};
function calcBMR(p){
  const w = parseFloat(p.weightKg), h = heightCm(p), age = parseFloat(p.ageYears)||0;
  if(p.gender==='male') return 10*w + 6.25*h - 5*age + 5;
  return 10*w + 6.25*h - 5*age - 161;
}
function heightCm(p){
  const ft = parseFloat(p.heightFt)||0, inch = parseFloat(p.heightIn)||0;
  return Math.round(((ft*12)+inch) * 2.54 * 10)/10;
}
function kgToLbs(kg){ return fmt1(kg*2.20462); }
// Set-logging weight is always stored internally in kg (for consistent overload math and
// charts) but displayed/entered in whichever unit the client prefers.
function toDisplayWeight(kgVal, unit){
  if(kgVal===''||kgVal==null||isNaN(parseFloat(kgVal))) return '';
  const kg = parseFloat(kgVal);
  return unit==='lbs' ? fmt1(kg*2.20462) : fmt1(kg);
}
function toStorageWeightKg(displayVal, unit){
  if(displayVal===''||displayVal==null||isNaN(parseFloat(displayVal))) return '';
  const v = parseFloat(displayVal);
  return unit==='lbs' ? fmt1(v/2.20462) : fmt1(v);
}
function kgToStone(kg){
  const totalLbs = kg*2.20462;
  const st = Math.floor(totalLbs/14);
  const lb = fmt1(totalLbs - st*14);
  return {st, lb};
}
// Occupational NEAT varies meaningfully independent of structured exercise —
// a desk job vs. a physically demanding job affects total daily energy expenditure.
const WORK_NEAT_KCAL = {
  'Sedentary Office Work': 0,
  'Moderate Physical Exertion': 150,
  'High Physical Exertion': 350
};
function calcTargets(p){
  const bmr = calcBMR(p);
  const tdee = bmr * (ACTIVITY_MULT[p.activityLevel]||1.375) + (WORK_NEAT_KCAL[p.work]||0);
  const w = parseFloat(p.weightKg);
  const bodyMods = applyBodyTypeModifiers(p.bodyType);
  const deficitFrac = 0.20 * bodyMods.deficitMult;   // base 20% deficit, nudged by body type
  const surplusFrac = 0.12 * bodyMods.surplusMult;   // base 12% surplus, nudged by body type

  function macroSet(calories, proteinPerKg, fatPct){
    const proteinG = Math.round(proteinPerKg * w);
    const proteinCal = proteinG*4;
    const fatCal = calories*fatPct;
    const fatG = Math.round(fatCal/9);
    const carbCal = Math.max(calories - proteinCal - fatCal, 0);
    const carbG = Math.round(carbCal/4);
    return {
      calories: Math.round(calories),
      protein:{g:proteinG, pct:Math.round(proteinCal/calories*100)},
      carbs:{g:carbG, pct:Math.round(carbCal/calories*100)},
      fat:{g:fatG, pct:Math.round(fatCal/calories*100)}
    };
  }
  return {
    bmr:Math.round(bmr), tdee:Math.round(tdee),
    cutting: macroSet(tdee*(1-deficitFrac), 2.2, 0.28),
    maintenance: macroSet(tdee, 1.8, 0.30),
    bulking: macroSet(tdee*(1+surplusFrac), 1.8, 0.27)
  };
}
function goalToCalorieKey(goal){
  if(goal==='fatloss') return 'cutting';
  if(goal==='muscle') return 'bulking';
  if(goal==='recomp') return 'maintenance';
  if(goal==='strength') return 'maintenance';
  if(goal==='endurance') return 'maintenance';
  return 'maintenance';
}

/* ============================= EXERCISE LIBRARY ============================= */
const EX = {

    push:[{n:'Barbell Bench Press',m:'Chest'},{n:'Overhead Press',m:'Shoulders'},{n:'Incline Dumbbell Press',m:'Chest'},{n:'Cable Lateral Raise',m:'Shoulders'},{n:'Dips',m:'Triceps'},{n:'Tricep Rope Pushdown',m:'Triceps'},{n:'Machine Chest Press',m:'Chest'},{n:'Arnold Press',m:'Shoulders'},{n:'Cable Crossover',m:'Chest'},{n:'Skull Crusher',m:'Triceps'}],

    full:[{n:'Back Squat',m:'Legs'},{n:'Barbell Bench Press',m:'Chest'},{n:'Barbell Row',m:'Back'},{n:'Overhead Press',m:'Shoulders'},{n:'Romanian Deadlift',m:'Hamstrings'},{n:'Plank',m:'Core'}]

function videoLink(name){

function goalScheme(goal){
  const schemes = {
    fatloss:{sets:3, reps:'10-15', rir:'1-2', restSec:60, label:'Fat Loss'},
    muscle:{sets:4, reps:'8-12', rir:'1-3', restSec:90, label:'Hypertrophy'},
    strength:{sets:5, reps:'3-6', rir:'1-3', restSec:180, label:'Strength'},
    recomp:{sets:3, reps:'8-12', rir:'1-2', restSec:75, label:'Recomposition'},
    endurance:{sets:3, reps:'15-20', rir:'2-3', restSec:40, label:'Muscular Endurance'}
  };
  return schemes[goal] || schemes.recomp;
}
function buildProgram(p){
  const days = parseInt(p.daysPerWeek)||3;
  const lib = EX[p.equipment] || EX.gym;
  const baseScheme = goalScheme(p.goal);
  const bodyMods = applyBodyTypeModifiers(p.bodyType);
  const scheme = {
    sets: Math.max(2, Math.min(6, Math.round(baseScheme.sets * bodyMods.volumeMult))),
    reps: baseScheme.reps,
    rir: baseScheme.rir,
    restSec: Math.max(20, baseScheme.restSec + bodyMods.restAddSec),
    label: baseScheme.label
  };
  const exCount = Math.max(4, Math.min(8, Math.floor((parseInt(p.sessionMins)||60)/9)));

  let template;
  if(days<=2) template = [{name:'Full Body A', pool:'full'},{name:'Full Body B', pool:'full'}];
  else if(days===3) template = [{name:'Full Body A', pool:'full'},{name:'Full Body B', pool:'full'},{name:'Full Body C', pool:'full'}];
  else if(days===4) template = [{name:'Upper A', pool:['push','pull']},{name:'Lower A', pool:'legs'},{name:'Upper B', pool:['push','pull']},{name:'Lower B', pool:'legs'}];
  else if(days===5) template = [{name:'Push', pool:'push'},{name:'Pull', pool:'pull'},{name:'Legs', pool:'legs'},{name:'Upper', pool:['push','pull']},{name:'Lower', pool:'legs'}];
  else template = [{name:'Push A', pool:'push'},{name:'Pull A', pool:'pull'},{name:'Legs A', pool:'legs'},{name:'Push B', pool:'push'},{name:'Pull B', pool:'pull'},{name:'Legs B', pool:'legs'}].slice(0,days);

  const occurrence = {};
  return template.map((day)=>{
    let pool = [];
    if(Array.isArray(day.pool)){
      const lists = day.pool.map(k=> lib[k].slice());
      const maxLen = Math.max(...lists.map(l=>l.length));
      for(let i=0;i<maxLen;i++){
        lists.forEach(l=>{ if(l[i]) pool.push(l[i]); });
      }
    }
    else { pool = lib[day.pool].slice(); }
    // rotate based on how many times this exact split-type (e.g. 'push,pull' or 'legs')
    // has already appeared in the week, so e.g. Upper A and Upper B don't pull identical exercises
    const poolKey = Array.isArray(day.pool) ? day.pool.join(',') : day.pool;
    const occ = occurrence[poolKey] || 0;
    occurrence[poolKey] = occ + 1;
    const offset = pool.length ? (occ * Math.max(1, Math.floor(pool.length/2))) % pool.length : 0;
    const rotated = pool.slice(offset).concat(pool.slice(0, offset));
    const chosen = rotated.slice(0, exCount);
    const exercises = chosen.map(e=>({
      name:e.n, muscle:e.m, sets:scheme.sets, repRange:scheme.reps, rir:scheme.rir, restSec:scheme.restSec
    }));
    // Endomorph modifier: add a conditioning finisher, since higher NEAT/cardio inclusion
    // is a reasonable, low-risk addition regardless of resistance-training goal.
    if(bodyMods.conditioning){
      exercises.push({
        name:'Conditioning Finisher (incline walk, bike, or rower)', muscle:'Conditioning',
        sets:1, repRange:'10–15 min steady', rir:'RPE 5–6', restSec:60
      });
    }
    return { name: day.name, exercises };
  });
}

/* ============================= PROGRESSIVE OVERLOAD ============================= */
function parseRepRange(repRange){
  const m = /(\d+)\s*[-–]\s*(\d+)/.exec(repRange||'');
  if(m) return {min:parseInt(m[1]), max:parseInt(m[2])};
  const single = /(\d+)/.exec(repRange||'');
  if(single) return {min:parseInt(single[1]), max:parseInt(single[1])};
  return {min:0, max:999};
}
function suggestNextWeight(dayName, exerciseName, repRange){
  const entries = Object.values(state.logs.workouts)
    .filter(w=>w.dayName===dayName && w.exercises[exerciseName])
    .sort((a,b)=> a.date < b.date ? 1 : -1);
  if(entries.length===0) return null;
  const lastSets = entries[0].exercises[exerciseName].filter(s=>s.done && s.weight);
  if(lastSets.length===0) return null;
  const avgRpe = lastSets.reduce((s,x)=>s+(parseFloat(x.rpe)||8),0)/lastSets.length;
  const avgReps = lastSets.reduce((s,x)=>s+(parseFloat(x.reps)||0),0)/lastSets.length;
  const maxWeight = Math.max(...lastSets.map(s=>parseFloat(s.weight)||0));
  const {min:repMin, max:repMax} = parseRepRange(repRange);

  let mult, reason;
  if(avgReps < repMin){
    mult = 0.95; reason = 'reps fell short of target range — slight decrease to hit reps next time';
  } else if(avgRpe >= 9.5){
    mult = 0.95; reason = 'RPE was very high — small deload';
  } else if(avgReps >= repMax && avgRpe <= 8){
    mult = 1.05; reason = 'hit the top of the rep range with room to spare — increase load';
  } else if(avgRpe <= 7){
    mult = 1.05; reason = 'RPE was low for the reps achieved — increase load';
  } else if(avgRpe <= 8.5){
    mult = 1.02; reason = 'solid effort — small increase';
  } else {
    mult = 1.0; reason = 'right at target — repeat this weight';
  }
  return { suggested: fmt1(maxWeight*mult), lastWeight:maxWeight, lastRpe:fmt1(avgRpe), lastReps:fmt1(avgReps), reason };
}

  wrap.appendChild(input);

  }
  if(gateSubmitError){

  }
  const goBtn = el(`<button class="btn btn-chalk px-6 py-3 rounded-lg w-full mb-3 ${gateBusy?'opacity-50 pointer-events-none':''}">${gateBusy?'Checking…':'Continue'}</button>`);

  wrap.appendChild(goBtn);

    wrap.appendChild(el(`<div class="chalk-rule my-6"></div>`));
    wrap.appendChild(el(`<p class="text-xs text-[var(--ink-2)] mb-3">No coach code set up yet on this app. If this is your first time here as the coach, set one now:</p>`));
    const setupInput = el(`<input placeholder="Choose a coach code" class="text-center font-mono tracking-widest uppercase mb-3" ${gateBusy?'disabled':''}>`);
    wrap.appendChild(setupInput);
    if(gateSetupError){
      wrap.appendChild(el(`<div class="text-xs text-[var(--alert)] mb-3 text-left">${gateSetupError}</div>`));
    }
    const setupBtn = el(`<button class="btn btn-ghost px-6 py-3 rounded-lg w-full ${gateBusy?'opacity-50 pointer-events-none':''}">${gateBusy?'Setting up…':'Set Coach Code'}</button>`);
    setupBtn.onclick = ()=> setupCoachCode(setupInput.value.trim().toUpperCase());
    wrap.appendChild(setupBtn);
  }
  return wrap;
}
async function setupCoachCode(code){
  gateSetupError = null;
  if(code.length<4){ gateSetupError='Coach code should be at least 4 characters.'; render(); return; }
  gateBusy = true; render();
  // re-check in case a coach was configured elsewhere moments ago
  try{
    const m = await window.storage.get('coach-configured', true);
    if(m && m.value){
      coachConfigured = true; gateBusy = false;
      gateSetupError = 'A coach code already exists for this app — ask the coach for the login code instead.';
      render(); return;
    }
  }catch(e){}
  const hash = await sha256Hex('coach:'+code);
  try{
    await window.storage.set('coach-auth-'+hash, 'true', true);
    await window.storage.set('coach-configured', 'true', true);
  }catch(e){}
  // Verify the write actually persisted rather than assuming it did — if the platform
  // showed a "this app wants to save shared data" prompt and it was declined, the
  // write can silently fail to stick even though nothing throws an error here.
  let confirmed = false;
  try{
    const check = await window.storage.get('coach-auth-'+hash, true);
    confirmed = !!(check && check.value);
  }catch(e){ confirmed = false; }
  gateBusy = false;
  if(!confirmed){
    gateSetupError = "Your coach code didn't save — check your internet connection and try again. If it keeps happening, the Firestore database rules may need to be set to allow read/write access.";
    render();
    return;
  }
  coachConfigured = true;
  gateSetupError = null;
  submitCode(code);
}
async function submitCode(code){
  gateSubmitError = null;
  if(!code){ gateSubmitError='Enter a code.'; render(); return; }
  gateBusy = true; render();
  const isCoach = await tryCoachLogin(code);
  if(isCoach){
    session = {role:'coach', clientId:null, clientName:null, viewingAsCoach:false};
    await loadRoster(); // safe now — coach has proven they know the coach code
    gateError = null; gateSubmitError = null; gateBusy = false;
    render();
    return;
  }
  const clientId = await tryClientLogin(code);
  if(clientId){
    session = {role:'client', clientId, clientName:null, viewingAsCoach:false};
    await loadClientState(clientId);
    session.clientName = state.profile.name || null;
    gateError = null; gateSubmitError = null; gateBusy = false;
    render();
    return;
  }
  gateBusy = false;
  gateSubmitError = "That code wasn't recognized.";
  render();
}

/* ============================= COACH DASHBOARD ============================= */
async function fetchClientData(id){
  let profileData=null, logs={workouts:{},bodyweight:[],food:{}};
  try{
    const d = await window.storage.get(clientDataKey(id), true);
    if(d && d.value){
      const parsed = JSON.parse(d.value);
      logs = parsed.logs || logs;
      profileData = {
        onboarded:parsed.onboarded, profile:parsed.profile, program:parsed.program,
        targets:parsed.targets, analysis:parsed.analysis, photos:parsed.photos
      };
    }
  }catch(e){}
  return {profileData, logs};
}
function summarizeClient(profileData, logs){
  if(!profileData || !profileData.onboarded) return {status:'pending'};
  const dates = [];
  Object.values(logs.workouts||{}).forEach(w=>{
    const hasDone = Object.values(w.exercises||{}).some(sets=>sets.some(s=>s.done));
    if(hasDone) dates.push(w.date);
  });
  (logs.bodyweight||[]).forEach(e=>dates.push(e.date));
  Object.keys(logs.food||{}).forEach(d=>dates.push(d));
  dates.sort();
  const lastLog = dates.length ? dates[dates.length-1] : null;
  const daysSince = lastLog ? Math.floor((new Date(todayISO())-new Date(lastLog))/86400000) : null;

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
  const sessionCount = Object.values(logs.workouts||{}).filter(w=>{
    const hasDone = Object.values(w.exercises||{}).some(sets=>sets.some(s=>s.done));
    return hasDone && new Date(w.date) >= cutoff;
  }).length;

  const bw = [...(logs.bodyweight||[])].sort((a,b)=>a.date<b.date?-1:1);
  let trend = null;
  if(bw.length>=2){ trend = fmt1(bw[bw.length-1].weightKg - bw[0].weightKg); }

  return {
    status: daysSince===null ? 'no-data' : (daysSince>=5 ? 'stale' : 'active'),
    lastLog, daysSince, sessionCount,
    targetSessions: parseInt(profileData.profile.daysPerWeek)||0,
    trend, goal: profileData.profile.goal
  };
}

      right.appendChild(el(`<div class="text-xs text-[var(--ink-2)] font-mono mt-0.5">${summary.sessionCount}/${summary.targetSessions} sessions this wk${summary.trend!=null? ' · '+(summary.trend>0?'+':'')+summary.trend+'kg':''}</div>`));

    delBtn.onclick = (e)=>{ e.stopPropagation(); confirmDeleteClient(client); };
    row.appendChild(delBtn);

async function doDeleteClient(client){
  try{ await window.storage.delete(clientDataKey(client.id), true); }catch(e){}
  try{
    const hash = await sha256Hex('client:'+client.code);
    await window.storage.delete('client-code-'+hash, true);
  }catch(e){}
  roster = roster.filter(c=>c.id!==client.id);
  await saveRoster();
  render();

async function exportAllData(){
  backupStatus = 'working'; render();

    for(const c of roster){
      const {profileData, logs} = await fetchClientData(c.id);
      bundle.clients[c.id] = { profileData, logs };

function computeNutritionSuggestion(){
  const bw = [...(state.logs.bodyweight||[])].sort((a,b)=>a.date<b.date?-1:1);
  const recent = bw.slice(-14);
  if(recent.length<4) return null;
  const mid = Math.floor(recent.length/2);
  const firstHalfAvg = recent.slice(0,mid).reduce((a,e)=>a+e.weightKg,0)/mid;
  const secondHalfAvg = recent.slice(mid).reduce((a,e)=>a+e.weightKg,0)/(recent.length-mid);
  const delta = fmt1(secondHalfAvg-firstHalfAvg);
  const goal = state.profile.goal;
  if(goal==='fatloss' && delta > -0.2){
    return {text:`Weight trend is roughly flat (${delta}kg) over the recent logging window despite a fat-loss goal. Consider reducing target calories by ~150kcal/day.`, amount:-150};
  }
  if(goal==='muscle' && delta < 0.1){
    return {text:`Weight trend is roughly flat (${delta}kg) over the recent logging window despite a muscle-gain goal. Consider adding ~150kcal/day.`, amount:150};
  }
  return null;
}
function applyNutritionSuggestion(sugg){
  const calKey = goalToCalorieKey(state.profile.goal);
  const t = state.targets[calKey];
  t.calories += sugg.amount;
  const proteinCal = t.protein.g*4, fatCal = t.fat.g*9;
  const carbCal = Math.max(t.calories - proteinCal - fatCal, 0);
  t.carbs.g = Math.round(carbCal/4);
  t.carbs.pct = Math.round(carbCal/t.calories*100);
  t.protein.pct = Math.round(proteinCal/t.calories*100);
  t.fat.pct = Math.round(fatCal/t.calories*100);
  queueSave();
  render();
}
async function generateCheckinDraft(){
  checkinStatus = 'loading'; render();
  try{
    const bw = [...(state.logs.bodyweight||[])].sort((a,b)=>a.date<b.date?-1:1);
    const latestWeight = bw.length ? bw[bw.length-1].weightKg : null;
    const weightChange = bw.length>=2 ? fmt1(bw[bw.length-1].weightKg - bw[0].weightKg) : null;
    const sessionsLogged = Object.values(state.logs.workouts||{}).filter(w=>Object.values(w.exercises||{}).some(sets=>sets.some(x=>x.done))).length;
    const foodDaysLogged = Object.keys(state.logs.food||{}).length;

    const prompt = `You are a supportive, professional personal trainer writing a short weekly check-in message to your client ${state.profile.name||'the client'}, whose goal is ${state.profile.goal||'general fitness'}.
Data: latest bodyweight ${latestWeight!=null?latestWeight+'kg':'not logged'}, change since first log ${weightChange!=null?weightChange+'kg':'not enough data yet'}, ${sessionsLogged} workout sessions logged, ${foodDaysLogged} days of food logged recently.
Write a warm, encouraging, specific 3-4 sentence check-in message the coach can send directly to the client via text message. Mention one concrete positive and one gentle, actionable focus for next week. No emojis. No clinical or diagnostic language. Respond with only the message text, nothing else.`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:400, messages:[{role:'user', content:prompt}]})
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    checkinDraft = textBlock ? textBlock.text.trim() : null;
    checkinStatus = checkinDraft ? 'done' : 'error';
  }catch(e){
    checkinStatus = 'error';
  }
  render();
}

const TOTAL_STEPS = 7;
let onboardError = null;
function validateStep(step, p){
  if(step===0){
    if(!p.gender) return 'Please select a gender — needed for an accurate calorie calculation.';
    if(!p.ageYears || parseFloat(p.ageYears)<=0) return 'Please enter your age.';
  }
  else if(step===1){
    if(!p.weightKg || parseFloat(p.weightKg)<=0) return 'Please enter your weight.';
    const totalIn = (parseFloat(p.heightFt)||0)*12 + (parseFloat(p.heightIn)||0);
    if(totalIn<=0) return 'Please enter your height.';
  }
  else if(step===3){
    if(!p.goal) return 'Please select a primary goal — this drives your whole program.';
  }
  else if(step===4){
    if(!p.work) return 'Please select your day-to-day work type.';
    if(!p.activityLevel) return 'Please select your activity level.';
  }
  else if(step===5){
    if(!p.daysPerWeek || parseInt(p.daysPerWeek)<=0) return 'Please enter how many days you can train.';
    if(!p.sessionMins || parseInt(p.sessionMins)<=0) return 'Please enter your session length.';
    if(!p.equipment) return 'Please select your equipment access.';
  }
  return null; // steps 2 (body type) and 6 (diet) stay optional
}

const GOALS = [

  {key:'strength', label:'Strength Training', desc:'Increase maximal force output on key lifts using low reps, heavy loads, and long rest.'},

// Somatotype is a rough, informal starting-point signal — not a rigid or clinical category.
// It nudges a handful of program variables (see applyBodyTypeModifiers); logged real-world
// progress always outweighs it as data accumulates.
const BODY_TYPES = [

// Small, transparent nudges applied on top of the base evidence-based defaults.
// Intentionally modest — the dominant driver of programming stays goal + logged progress.
function applyBodyTypeModifiers(bodyType){
  const mods = {
    ectomorph: {surplusMult:1.4, deficitMult:0.85, volumeMult:0.9, restAddSec:15, conditioning:false},
    mesomorph: {surplusMult:1.0, deficitMult:1.0, volumeMult:1.0, restAddSec:0, conditioning:false},
    endomorph: {surplusMult:0.85, deficitMult:1.15, volumeMult:1.08, restAddSec:-10, conditioning:true}
  };
  return mods[bodyType] || mods.mesomorph;
}

/* ============================= COACH PROGRAM EDITING ============================= */
let workoutEditMode = false;
function updateProgramField(dayIdx, exIdx, field, value){
  state.program[dayIdx].exercises[exIdx][field] = value;
  queueSave();
}
function removeExerciseFromDay(dayIdx, exIdx){
  state.program[dayIdx].exercises.splice(exIdx,1);
  queueSave(); render();
}
function addExerciseToDay(dayIdx){
  state.program[dayIdx].exercises.push({name:'New Exercise', muscle:'', sets:3, repRange:'8-12', rir:'1-2', restSec:60});
  queueSave(); render();
}
function moveExercise(dayIdx, exIdx, dir){
  const arr = state.program[dayIdx].exercises;
  const newIdx = exIdx+dir;
  if(newIdx<0 || newIdx>=arr.length) return;
  const tmp = arr[exIdx]; arr[exIdx]=arr[newIdx]; arr[newIdx]=tmp;
  queueSave(); render();
}
function renameDay(dayIdx, name){
  state.program[dayIdx].name = name;
  queueSave();
}
function addDay(){
  state.program.push({name:'New Day', exercises:[]});
  state.activeDayIndex = state.program.length-1;
  queueSave(); render();
}
function removeDay(dayIdx){
  if(state.program.length<=1) return; // always keep at least one day
  state.program.splice(dayIdx,1);
  if(state.activeDayIndex>=state.program.length) state.activeDayIndex = state.program.length-1;
  queueSave(); render();
}

/* ============================= REST TIMER ============================= */
const Timer = {
  remaining:0, interval:null,
  start(sec){
    clearInterval(this.interval);
    this.remaining = sec;
    $('timerBar').classList.remove('hidden');
    this.tick();
    this.interval = setInterval(()=>this.tick(), 1000);
  },
  tick(){
    if(this.remaining<=0){
      clearInterval(this.interval);
      $('timerDisplay').textContent = "GO";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      try{ new AudioContext(); }catch(e){}
      beep();
      setTimeout(()=> $('timerBar').classList.add('hidden'), 2500);
      return;
    }
    const m = Math.floor(this.remaining/60), s = this.remaining%60;
    $('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    this.remaining--;
  },
  adjust(delta){ this.remaining = Math.max(0,this.remaining+delta); },
  skip(){ this.remaining=0; this.tick(); }
};
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
  }catch(e){}
}

const FOOD_IDEAS = {
  protein:['chicken breast','salmon','greek yoghurt','egg whites','lean beef','tofu','cottage cheese','whey protein','turkey mince','white fish'],
  carb:['rice','oats','sweet potato','quinoa','wholemeal bread','banana','berries','potatoes','couscous'],
  fat:['olive oil','almonds','avocado','peanut butter','walnuts','olive oil dressing']
};
function suggestMeals(p){
  const dislikes = (p.dietaryDislikes||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  const restricted = (p.dietaryRestrictions||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  const filterOut = [...dislikes, ...restricted];
  function pick(list){ return list.filter(f=>!filterOut.some(d=>d && f.includes(d))); }
  const proteins = pick(FOOD_IDEAS.protein);
  const carbs = pick(FOOD_IDEAS.carb);
  const fats = pick(FOOD_IDEAS.fat);
  return {proteins, carbs, fats};
}

    <li><b>Whey/plant protein</b> — only if you're consistently short of your protein target through whole food. Timing within the day matters more than "the anabolic window."</li>
    <li><b>Caffeine</b> — 100-300mg, 30-60 min pre-training, for performance and focus.</li>

    <li><b>Mass gainers</b> — just whole food plus your carb/fat targets above; usually cheaper and more filling.</li>

  suppGrid.appendChild(useful); suppGrid.appendChild(skip);

  timingCard.innerHTML = mealTimingHTML(state.profile.trainingTime);

}
function mealTimingHTML(time){
  const common = `<p>Total daily protein and calorie targets matter far more than exact timing — but spreading protein across 3-5 meals (each ~0.3-0.4g/kg) optimizes muscle protein synthesis.</p>`;
  if(time==='AM') return common + `<p><b>Pre-workout (AM):</b> a small carb+protein snack 30-60 min before if training fasted feels hard (e.g. banana + yoghurt). <b>Post-workout:</b> your largest protein+carb meal of the day within 1-2 hours.</p>`;
  if(time==='Midday') return common + `<p><b>Pre-workout:</b> a balanced meal 2-3 hours before training. <b>Post-workout:</b> a protein+carb meal shortly after to refuel for the rest of the day.</p>`;
  return common + `<p><b>Pre-workout (PM):</b> your main carb+protein meal 2-3 hours before training. <b>Post-workout:</b> a moderate protein+carb meal; avoid an overly heavy meal right before sleep.</p>`;
}

  const totals = todayFood.reduce((a,f)=>({cals:a.cals+f.cals, protein:a.protein+f.protein, carbs:a.carbs+f.carbs, fat:a.fat+f.fat}), {cals:0,protein:0,carbs:0,fat:0});

  if(todayFood.length===0){ list.appendChild(el(`<div class="text-sm text-[var(--ink-2)]">Nothing logged yet today.</div>`)); }
  todayFood.forEach((f,idx)=>{

/* ---- Editing an already-logged food entry ---- */
let editingFoodIndex = null;
function renderFoodEditRow(f, idx){
  const box = el(`<div class="mt-2 p-3 rounded-lg border border-[var(--line)] bg-[var(--bg-2)]"></div>`);

  if(f.per100){
    // Entry came from search/scan — we know its per-100 rate, so editing the
    // amount just rescales cals/protein/carbs/fat rather than needing manual re-entry.
    box.appendChild(el(`<div class="font-medium text-sm mb-2">${f.baseName || f.name}</div>`));
    let selectedUnit = f.unit || 'g';
    const row = el(`<div class="flex items-center gap-2 mb-2"></div>`);
    const qtyInput = el(`<input type="number" value="${f.qty}" class="w-24">`);
    row.appendChild(qtyInput);

    ['g','ml'].forEach(u=>{
      const b = el(`<button type="button" class="px-2.5 py-1.5 rounded ${selectedUnit===u?'btn-chalk':'btn-ghost'}">${u}</button>`);
      b.onclick = ()=>{
        selectedUnit = u;
        Array.from(unitToggle.children).forEach(child=>{
          child.className = `px-2.5 py-1.5 rounded ${child.textContent===u?'btn-chalk':'btn-ghost'}`;
        });
      };
      unitToggle.appendChild(b);
    });
    row.appendChild(unitToggle);
    box.appendChild(row);
    const preview = el(`<div class="font-mono text-xs text-[var(--ink-1)] mb-3"></div>`);
    function updatePreview(){
      const qty = parseFloat(qtyInput.value)||0;
      const m = scaleMacros(f.per100, qty);
      preview.textContent = `${Math.round(m.cals)} kcal · P${fmt1(m.protein)}g C${fmt1(m.carbs)}g F${fmt1(m.fat)}g`;
    }
    qtyInput.oninput = updatePreview;
    updatePreview();
    box.appendChild(preview);
    const btnRow = el(`<div class="flex gap-2"></div>`);
    const saveBtn = el(`<button class="btn btn-chalk px-4 py-2 rounded-lg text-xs flex-1">Save</button>`);
    saveBtn.onclick = ()=>{
      const qty = parseFloat(qtyInput.value)||0;
      const unit = selectedUnit;
      const m = scaleMacros(f.per100, qty);
      f.qty = qty;
      f.unit = unit;
      f.name = `${f.baseName} (${qty}${unit})`;
      f.cals = Math.round(m.cals);
      f.protein = fmt1(m.protein);
      f.carbs = fmt1(m.carbs);
      f.fat = fmt1(m.fat);
      editingFoodIndex = null;
      queueSave(); render();
    };
    const cancelBtn = el(`<button class="btn btn-ghost px-4 py-2 rounded-lg text-xs">Cancel</button>`);
    cancelBtn.onclick = ()=>{ editingFoodIndex=null; render(); };
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
    box.appendChild(btnRow);
  } else {
    // Manually-entered item — no per-100 rate to scale from, so edit the numbers directly.
    box.appendChild(el(`<div class="text-xs text-[var(--ink-2)] mb-2">Manually entered — edit values directly</div>`));
    const form = el(`<div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-3"></div>`);
    const nameIn = el(`<input value="${f.name}" placeholder="Food name" class="sm:col-span-1 col-span-2">`);
    const calIn = el(`<input type="number" value="${f.cals}" placeholder="kcal">`);
    const pIn = el(`<input type="number" value="${f.protein}" placeholder="Protein g">`);
    const cIn = el(`<input type="number" value="${f.carbs}" placeholder="Carbs g">`);
    const fIn = el(`<input type="number" value="${f.fat}" placeholder="Fat g">`);
    form.appendChild(nameIn); form.appendChild(calIn); form.appendChild(pIn); form.appendChild(cIn); form.appendChild(fIn);
    box.appendChild(form);
    const btnRow = el(`<div class="flex gap-2"></div>`);
    const saveBtn = el(`<button class="btn btn-chalk px-4 py-2 rounded-lg text-xs flex-1">Save</button>`);
    saveBtn.onclick = ()=>{
      f.name = nameIn.value || f.name;
      f.cals = parseFloat(calIn.value)||0;
      f.protein = parseFloat(pIn.value)||0;
      f.carbs = parseFloat(cIn.value)||0;
      f.fat = parseFloat(fIn.value)||0;
      editingFoodIndex = null;
      queueSave(); render();
    };
    const cancelBtn = el(`<button class="btn btn-ghost px-4 py-2 rounded-lg text-xs">Cancel</button>`);
    cancelBtn.onclick = ()=>{ editingFoodIndex=null; render(); };
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
    box.appendChild(btnRow);
  }
  return box;
}

/* ---- Search panel (live food database + offline fallback) ---- */
function renderFoodSearchPanel(){
  const wrap = el(`<div></div>`);
  const searchInput = el(`<input placeholder="Search a food e.g. chicken breast" value="${state.foodSearch.query||''}">`);
  const resultsBox = el(`<div class="mt-2 space-y-1 max-h-56 overflow-y-auto"></div>`);
  let debounceT;
  searchInput.oninput = (e)=>{
    state.foodSearch.query = e.target.value;
    clearTimeout(debounceT);
    debounceT = setTimeout(()=> doFoodSearch(state.foodSearch.query, resultsBox), 400);
  };
  wrap.appendChild(searchInput);
  wrap.appendChild(resultsBox);
  if(state.foodSearch.results && state.foodSearch.results.length){
    populateResultsBox(resultsBox, state.foodSearch.results);
  }
  const panelHolder = el(`<div></div>`);
  wrap.appendChild(panelHolder);
  if(state.foodSearch.selected){ panelHolder.appendChild(renderQtyPanel()); }
  return wrap;
}
async function doFoodSearch(query, resultsBox){
  if(!query || query.trim().length<2){ resultsBox.innerHTML=''; state.foodSearch.results=[]; return; }
  resultsBox.innerHTML = `<div class="text-xs text-[var(--ink-2)] py-2">Searching…</div>`;
  let results = [];
  let usedFallback = false;
  try{
    const res = await fetch(`https://uk.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8&tagtype_0=countries&tag_contains_0=contains&tag_0=united-kingdom`);
    const data = await res.json();
    results = (data.products||[])
      .filter(p=>p.product_name && p.nutriments && p.nutriments['energy-kcal_100g']!=null)
      .slice(0,8)
      .map(p=>({
        name:p.product_name,
        brand:p.brands ? p.brands.split(',')[0].trim() : '',
        per100:{
          cals:p.nutriments['energy-kcal_100g']||0,
          protein:p.nutriments['proteins_100g']||0,
          carbs:p.nutriments['carbohydrates_100g']||0,
          fat:p.nutriments['fat_100g']||0
        }
      }));
  }catch(e){ results = []; }
  if(results.length===0){
    usedFallback = true;
    const q = query.toLowerCase();
    results = COMMON_FOODS.filter(f=>f.name.toLowerCase().includes(q)).slice(0,8);
  }
  state.foodSearch.results = results;
  state.foodSearch.usedFallback = usedFallback;
  populateResultsBox(resultsBox, results, usedFallback);
}
function populateResultsBox(container, results, usedFallback){
  container.innerHTML='';
  if(usedFallback && results.length>0){
    container.appendChild(el(`<div class="text-xs text-[var(--ink-2)] pb-1">Showing offline results</div>`));
  }
  if(results.length===0){
    container.appendChild(el(`<div class="text-xs text-[var(--ink-2)] py-2">No matches — try manual entry.</div>`));
    return;
  }
  results.forEach(r=>{
    const b = el(`<button class="w-full text-left px-3 py-2 rounded hover:bg-[var(--bg-3)] flex justify-between items-center gap-2"></button>`);
    b.appendChild(el(`<span class="text-sm truncate">${r.name}${r.brand?` <span class="text-[var(--ink-2)] text-xs">· ${r.brand}</span>`:''}</span>`));
    b.appendChild(el(`<span class="font-mono text-xs text-[var(--ink-2)] whitespace-nowrap">${Math.round(r.per100.cals)}kcal/100g</span>`));
    b.onclick = ()=>{ state.foodSearch.selected=r; state.foodSearch.qty=100; render(); };
    container.appendChild(b);
  });
}

  `);

  const status = $('scanStatus');
  let stream, scanRAF;
  const closeScanner = ()=>{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(scanRAF) cancelAnimationFrame(scanRAF);
    overlay.remove();
  };
  $('scanCloseBtn').onclick = closeScanner;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream;
  }catch(e){
    status.textContent = "Camera unavailable — enter the barcode number manually instead.";
    return;
  }
  if(!('BarcodeDetector' in window)){
    status.textContent = "This browser can't auto-scan — enter the barcode number manually instead.";
    return;
  }
  let detector;
  try{ detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }
  catch(e){ status.textContent = "Scanner unavailable — enter the barcode number manually instead."; return; }
  const scanLoop = async ()=>{
    try{
      const codes = await detector.detect(video);
      if(codes.length>0){
        const code = codes[0].rawValue;
        closeScanner();
        lookupBarcode(code);
        return;
      }
    }catch(e){}
    scanRAF = requestAnimationFrame(scanLoop);
  };
  status.textContent = 'Scanning…';
  scanRAF = requestAnimationFrame(scanLoop);
}
async function lookupBarcode(code){
  if(!code) return;
  state.foodSearch.scanError = null;
  try{
    const res = await fetch(`https://uk.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
    const data = await res.json();
    if(data.status===1 && data.product){
      const n = data.product.nutriments || {};
      state.foodSearch.selected = {
        name: data.product.product_name || 'Unknown product',
        brand: data.product.brands ? data.product.brands.split(',')[0].trim() : '',
        per100:{
          cals:n['energy-kcal_100g']||0,
          protein:n['proteins_100g']||0,
          carbs:n['carbohydrates_100g']||0,
          fat:n['fat_100g']||0
        }
      };
      state.foodSearch.qty = 100;
    } else {
      state.foodSearch.scanError = 'Product not found — try search or manual entry.';
    }
  }catch(e){
    state.foodSearch.scanError = 'Lookup failed — check your connection and try again.';
  }
  render();
}

/* ---- Manual entry panel (fallback for anything not in the database) ---- */
function renderManualPanel(){
  const wrap = el(`<div></div>`);
  const form = el(`<div class="grid grid-cols-2 sm:grid-cols-5 gap-2"></div>`);
  const nameIn = el(`<input placeholder="Food name" class="sm:col-span-1 col-span-2">`);
  const calIn = el(`<input type="number" placeholder="kcal">`);
  const pIn = el(`<input type="number" placeholder="Protein g">`);
  const cIn = el(`<input type="number" placeholder="Carbs g">`);
  const fIn = el(`<input type="number" placeholder="Fat g">`);
  form.appendChild(nameIn); form.appendChild(calIn); form.appendChild(pIn); form.appendChild(cIn); form.appendChild(fIn);
  wrap.appendChild(form);
  const addBtn = el(`<button class="btn btn-chalk px-4 py-2 rounded-lg mt-3">Add Entry</button>`);
  addBtn.onclick = ()=>{
    if(!nameIn.value) return;
    const entry = {name:nameIn.value, cals:parseFloat(calIn.value)||0, protein:parseFloat(pIn.value)||0, carbs:parseFloat(cIn.value)||0, fat:parseFloat(fIn.value)||0};
    if(!state.logs.food[todayISO()]) state.logs.food[todayISO()]=[];
    state.logs.food[todayISO()].push(entry);
    queueSave(); render();
  };
  wrap.appendChild(addBtn);
  return wrap;
}

/* ============================= PROGRESS ============================= */
let chartInstances = [];
function renderProgress(){
  chartInstances.forEach(c=>c.destroy());
  chartInstances = [];
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h2 class="font-display text-2xl font-bold mb-1">Progress</h2>`));
  wrap.appendChild(el(`<p class="text-sm text-[var(--ink-2)] mb-6">Weekly trends across your logged sessions — top weight per session confirms progressive overload.</p>`));

  // bodyweight chart
  if(state.logs.bodyweight.length>0){
    const sortedForLatest = [...state.logs.bodyweight].sort((a,b)=>a.date<b.date?-1:1);
    const latest = sortedForLatest[sortedForLatest.length-1];
    const latestStone = kgToStone(latest.weightKg);
    const bwCard = el(`<div class="card p-4 mb-5"><div class="flex justify-between items-baseline mb-2"><div class="label">Body Weight (kg)</div><div class="font-mono text-xs text-[var(--ink-2)]">latest: ${latestStone.st}st ${latestStone.lb}lb</div></div><canvas height="90"></canvas></div>`);
    wrap.appendChild(bwCard);
    setTimeout(()=>{
      const sorted = [...state.logs.bodyweight].sort((a,b)=>a.date<b.date?-1:1);
      const ctx = bwCard.querySelector('canvas').getContext('2d');
      chartInstances.push(new Chart(ctx, {
        type:'line',
        data:{labels:sorted.map(e=>e.date), datasets:[{data:sorted.map(e=>e.weightKg), borderColor:currentTheme().chalk, backgroundColor:`rgba(${currentTheme().rgb},0.15)`, fill:true, tension:0.3}]},
        options: chartOpts()
      }));
    },0);
  }

  // per-exercise charts
  const exNames = new Set();
  Object.values(state.logs.workouts).forEach(w=> Object.keys(w.exercises).forEach(n=>exNames.add(n)));
  if(exNames.size===0){
    wrap.appendChild(el(`<div class="card p-4 text-sm text-[var(--ink-2)]">Log a few workouts to see exercise progress charts here.</div>`));
  }
  exNames.forEach(name=>{
    const sessions = Object.values(state.logs.workouts)
      .filter(w=>w.exercises[name] && w.exercises[name].some(s=>s.done))
      .sort((a,b)=>a.date<b.date?-1:1);
    if(sessions.length===0) return;
    const card = el(`<div class="card p-4 mb-5"><div class="label mb-2">${name}</div><canvas height="90"></canvas></div>`);
    wrap.appendChild(card);
    setTimeout(()=>{
      const ctx = card.querySelector('canvas').getContext('2d');
      const topWeights = sessions.map(s=>{
        const done = s.exercises[name].filter(x=>x.done && x.weight);
        return done.length ? Math.max(...done.map(x=>parseFloat(x.weight))) : 0;
      });
      const totalReps = sessions.map(s=> s.exercises[name].filter(x=>x.done).reduce((a,x)=>a+(parseInt(x.reps)||0),0));
      chartInstances.push(new Chart(ctx, {
        type:'line',
        data:{labels:sessions.map(s=>s.date), datasets:[
          {label:'Top set weight (kg)', data:topWeights, borderColor:currentTheme().chalk, backgroundColor:`rgba(${currentTheme().rgb},0.12)`, fill:true, tension:0.3, yAxisID:'y'},
          {label:'Total reps', data:totalReps, borderColor:'#5B6B7C', tension:0.3, yAxisID:'y1'}
        ]},
        options: chartOpts(true)
      }));
    },0);
  });

  return wrap;
}
function chartOpts(dual=false){
  const base = {
    responsive:true,
    plugins:{legend:{labels:{color:'#B8B7B0', font:{family:'Inter'}}}},
    scales:{
      x:{ticks:{color:'#7C7B76'}, grid:{color:'#232326'}},
      y:{ticks:{color:'#7C7B76'}, grid:{color:'#232326'}}
    }
  };
  if(dual){ base.scales.y1 = {position:'right', ticks:{color:'#7C7B76'}, grid:{display:false}}; }
  return base;
}

/* ============================= PHOTOS / AI ANALYSIS ============================= */
function renderPhotos(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h2 class="font-display text-2xl font-bold mb-1">Physique Photos</h2>`));
  wrap.appendChild(el(`<p class="text-sm text-[var(--ink-2)] mb-2 max-w-xl">For an accurate read, photos should be taken in swimming shorts (male) or a bikini (female), full body length, in good lighting, from three angles. This gives a rough visual estimate only — not a substitute for a clinical measurement like DEXA or BodPod.</p>`));

  const grid = el(`<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>`);
  [['front','Front'],['side','Side'],['rear','Rear'],['target','Target Physique']].forEach(([key,label])=>{
    const slot = el(`<div class="card p-3 text-center"></div>`);
    slot.appendChild(el(`<div class="label mb-2">${label}</div>`));
    if(state.photos[key]){
      slot.appendChild(el(`<img src="${state.photos[key]}" class="w-full h-32 object-cover rounded mb-2">`));
    } else {
      slot.appendChild(el(`<div class="w-full h-32 rounded mb-2 checker flex items-center justify-center text-xs text-[var(--ink-2)]">No photo</div>`));
    }
    const inputId = 'photo-'+key;
    const inp = el(`<input type="file" accept="image/*" id="${inputId}" class="hidden">`);
    inp.onchange = async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      state.photos[key] = await resizeImageFile(f);
      queueSave(); render();
    };
    slot.appendChild(inp);
    const btn = el(`<button class="btn btn-ghost text-xs px-3 py-1.5 rounded w-full">Upload</button>`);
    btn.onclick = ()=> inp.click();
    slot.appendChild(btn);
    grid.appendChild(slot);
  });
  wrap.appendChild(grid);

  const analyzeBtn = el(`<button class="btn btn-chalk px-5 py-3 rounded-lg mb-6">Analyze My Photos</button>`);
  analyzeBtn.onclick = runPhotoAnalysis;
  if(!state.photos.front && !state.photos.side && !state.photos.rear){
    analyzeBtn.classList.add('opacity-40','pointer-events-none');
  }
  wrap.appendChild(analyzeBtn);

  if(state.analysis.status==='loading'){
    wrap.appendChild(el(`<div class="flex items-center gap-2 text-sm text-[var(--ink-2)] mb-6"><div class="w-4 h-4 border-2 border-[var(--chalk)] border-t-transparent rounded-full spin"></div> Analyzing...</div>`));
  }
  if(state.analysis.status==='error'){
    wrap.appendChild(el(`<div class="text-sm text-[var(--alert)] mb-6">Analysis failed. Please try again.</div>`));
  }
  if(state.analysis.status==='done' && state.analysis.result){
    const r = state.analysis.result;
    const card = el(`<div class="card p-5"></div>`);
    card.appendChild(el(`<div class="label mb-2">Analysis Result <span class="text-[var(--ink-2)] normal-case">(visual estimate — not a clinical measurement)</span></div>`));
    card.appendChild(el(`<div class="font-display text-2xl font-bold text-[var(--chalk)] mb-3">${r.bodyFatRange || '—'} est. body fat</div>`));
    card.appendChild(el(`<p class="text-sm text-[var(--ink-1)] mb-3">${r.goalAlignment || ''}</p>`));
    if(r.focusAreas){
      card.appendChild(el(`<div class="label mb-1">Suggested Training Focus</div>`));
      card.appendChild(el(`<p class="text-sm text-[var(--ink-1)] mb-3">${r.focusAreas}</p>`));
    }
    if(r.timeframe){
      card.appendChild(el(`<div class="label mb-1">Realistic Timeframe</div>`));
      card.appendChild(el(`<p class="text-sm text-[var(--ink-1)]">${r.timeframe}</p>`));
    }
    wrap.appendChild(card);
  }

  return wrap;
}

async function runPhotoAnalysis(){
  state.analysis.status='loading'; render();
  try{
    const content = [];
    const addImg = (label, dataUrl)=>{
      if(!dataUrl) return;
      content.push({type:'text', text:label});
      content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data: dataUrl.split(',')[1]}});
    };
    addImg('Front view:', state.photos.front);
    addImg('Side view:', state.photos.side);
    addImg('Rear view:', state.photos.rear);
    addImg('Target physique (aspirational reference):', state.photos.target);

    content.push({type:'text', text:`
You are a supportive, evidence-based fitness coach. Give a rough, kind, non-judgmental visual assessment for training-planning purposes only — never present it as a precise or clinical measurement.
The person's stated goal is: "${state.profile.goal}". Gender: ${state.profile.gender}.
Respond ONLY with strict JSON, no markdown, in this exact shape:
{"bodyFatRange":"e.g. 18-22%","goalAlignment":"1-2 sentences on whether their stated goal fits what's visually apparent, phrased supportively and evidence-based","focusAreas":"1-2 sentences on which muscle groups/areas the program should emphasize, especially relative to the target photo if provided","timeframe":"1 sentence realistic timeframe estimate assuming consistent training and correct nutrition"}
Keep total output under 120 words. Do not mention weight loss drugs. Be encouraging, never body-shaming.`});

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user', content}]})
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    let clean = (textBlock ? textBlock.text : '{}').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    state.analysis = {status:'done', result:parsed};
  }catch(e){
    console.error(e);
    state.analysis = {status:'error', result:null};
  }
  queueSave(); render();
}
