<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>IRON LOG — Training & Nutrition System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#111113; --bg-1:#1B1B1E; --bg-2:#232326; --bg-3:#2C2C30;
    --line:#38383C;
    --ink-0:#F3F2EC; --ink-1:#B8B7B0; --ink-2:#7C7B76;
    --chalk:#E8C547; --chalk-dim:#8A7A33; --chalk-light:#F5DE7E; --chalk-text:#1B1B1E; --chalk-hover:#F0D566;
    --alert:#E85D3F;
    --ok:#6FCF97;
    --steel:#5B6B7C;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg-0); color:var(--ink-0); font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent;}
  .font-display{font-family:'Oswald',sans-serif; letter-spacing:0.02em;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--bg-3); border-radius:4px;}
  .chalk-rule{position:relative; height:2px; background:repeating-linear-gradient(90deg,var(--chalk) 0 6px, transparent 6px 10px); opacity:0.55;}
  .plate{border-radius:9999px; border:3px solid var(--chalk-dim);}
  .plate.filled{border-color:var(--chalk); background:radial-gradient(circle at 35% 30%, var(--chalk-light), var(--chalk) 60%);}
  .card{background:var(--bg-1); border:1px solid var(--line); border-radius:10px;}
  .btn{font-family:'Oswald',sans-serif; letter-spacing:0.04em; text-transform:uppercase; font-weight:600; transition:transform .12s ease, background .15s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-chalk{background:var(--chalk); color:var(--chalk-text);}
  .btn-chalk:hover{background:var(--chalk-hover);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-0);}
  .btn-ghost:hover{border-color:var(--chalk-dim);}
  .btn-alert{background:var(--alert); color:#1B1B1E;}
  input,select,textarea{background:var(--bg-2); border:1px solid var(--line); color:var(--ink-0); border-radius:8px; padding:10px 12px; width:100%; font-family:'Inter',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--chalk-dim);}
  input[type=range]{padding:0;}
  .label{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.06em; font-size:11px; color:var(--ink-2);}
  .tab-btn{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; font-size:13px;}
  .tab-btn.active{color:var(--chalk); border-color:var(--chalk);}
  .tab-btn:not(.active){color:var(--ink-2); border-color:transparent;}
  .progress-track{background:var(--bg-2); border-radius:999px; overflow:hidden; height:10px;}
  .progress-fill{height:100%; border-radius:999px; transition:width .4s ease;}
  .quote-overlay{position:fixed; inset:0; z-index:60; background:linear-gradient(180deg,#0c0c0d,#141416); display:flex; align-items:center; justify-content:center;}
  .fade-out{animation:fadeOut .6s ease forwards;}
  @keyframes fadeOut{to{opacity:0; visibility:hidden;}}
  .set-row.done{background:rgba(111,207,151,0.08); border-color:rgba(111,207,151,0.35);}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .checker{background-image: linear-gradient(45deg, var(--bg-2) 25%, transparent 25%), linear-gradient(-45deg, var(--bg-2) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--bg-2) 75%), linear-gradient(-45deg, transparent 75%, var(--bg-2) 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px;}
</style>
</head>
<body class="min-h-screen">

<div id="app" class="max-w-5xl mx-auto pb-24 px-4 sm:px-6"></div>

<!-- Rest timer floating bar -->
<div id="timerBar" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-[var(--bg-1)] border-t border-[var(--line)]">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div>
      <div class="label">Rest</div>
      <div id="timerDisplay" class="font-mono text-3xl font-bold text-[var(--chalk)]">01:30</div>
    </div>
    <div class="flex gap-2">
      <button onclick="Timer.adjust(-15)" class="btn btn-ghost px-3 py-2 rounded">-15s</button>
      <button onclick="Timer.adjust(15)" class="btn btn-ghost px-3 py-2 rounded">+15s</button>
      <button onclick="Timer.skip()" class="btn btn-alert px-4 py-2 rounded">Skip</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================= STORAGE BACKEND (Firebase Firestore) ============================= */
// Claude's built-in window.storage requires every viewer to be on a paid Claude plan.
// This app instead uses Firebase Firestore (free Spark plan, no card required) so it
// works for the coach AND every client, on any device, with or without a Claude account.
const firebaseConfig = {
  apiKey: "AIzaSyD0kGUjBcHXGg9er_1n9Yb0iSc7Vlgl8EI",
  authDomain: "ironlog-6c0ff.firebaseapp.com",
  projectId: "ironlog-6c0ff",
  storageBucket: "ironlog-6c0ff.firebasestorage.app",
  messagingSenderId: "775990042723",
  appId: "1:775990042723:web:5359ccadd1de8eac161856"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

window.storage = {
  get: async (key)=>{
    try{
      const snap = await db.collection('kv').doc(key).get();
      if(!snap.exists) return null;
      return {key, value: snap.data().value, shared:true};
    }catch(e){ return null; }
  },
  set: async (key, value)=>{
    try{
      await db.collection('kv').doc(key).set({value});
      return {key, value, shared:true};
    }catch(e){ return null; }
  },
  delete: async (key)=>{
    try{
      await db.collection('kv').doc(key).delete();
      return {key, deleted:true, shared:true};
    }catch(e){ return null; }
  },
  list: async (prefix)=>{
    try{
      const p = prefix || '';
      const snap = await db.collection('kv')
        .where(firebase.firestore.FieldPath.documentId(), '>=', p)
        .where(firebase.firestore.FieldPath.documentId(), '<', p + '\uf8ff')
        .get();
      const keys = snap.docs.map(d=>d.id);
      return {keys, prefix, shared:true};
    }catch(e){ return null; }
  }
};

function genCode(len=6){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I
  let out='';
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
// SHA-256 hash of a code, used so we only ever look up "does this exact guess match something"
// rather than loading the full list of valid codes into memory for anyone browsing.
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Attempts to log in as coach. Only fetches a single hash-keyed marker for THIS guess —
// never loads the actual coach code or any client data.
async function tryCoachLogin(code){
  try{
    const hash = await sha256Hex('coach:'+code);
    const r = await window.storage.get('coach-auth-'+hash, true);
    return !!(r && r.value);
  }catch(e){ return false; }
}
// Attempts to log in as a client. Only fetches a single hash-keyed marker for THIS guess,
// which resolves to that one client's internal id — a wrong guess reveals nothing about
// any other client, and correct guesses never expose other clients' codes or data.
async function tryClientLogin(code){
  try{
    const hash = await sha256Hex('client:'+code);
    const r = await window.storage.get('client-code-'+hash, true);
    return (r && r.value) ? r.value : null;
  }catch(e){ return null; }
}
// Only called once the coach has already authenticated — safe to load the full roster here.
async function loadRoster(){
  try{
    const r = await window.storage.get('roster', true);
    if(r && r.value) roster = JSON.parse(r.value);
  }catch(e){ roster = []; }
}
async function saveRoster(){
  try{ await window.storage.set('roster', JSON.stringify(roster), true); }catch(e){}
}

      analysis:state.analysis, onboarded:state.onboarded, photos:state.photos,

function showResetModal(){
  if($('resetModal')) return;
  const overlay = el(`
    <div id="resetModal" class="fixed inset-0 z-[70] bg-black/70 flex items-center justify-center px-4">
      <div class="card p-6 max-w-sm w-full">
        <h3 class="font-display text-xl font-bold mb-2">Reset all data?</h3>
        <p class="text-sm text-[var(--ink-2)] mb-6">This clears your profile, program, logs, and photos. This can't be undone.</p>
        <div class="flex gap-3">
          <button id="resetCancelBtn" class="btn btn-ghost flex-1 py-2.5 rounded-lg">Cancel</button>
          <button id="resetConfirmBtn" class="btn btn-alert flex-1 py-2.5 rounded-lg">Reset</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  $('resetCancelBtn').onclick = ()=> overlay.remove();
  $('resetConfirmBtn').onclick = async ()=>{
    overlay.remove();
    await doReset();
  };
}
async function doReset(){
  if(session.clientId){

function ensureMealPlanFields(){
  if(!state.profile.intermittentFasting || typeof state.profile.intermittentFasting!=='object'){
    state.profile.intermittentFasting = {enabled:false, protocol:''};

  if(typeof state.profile.usesProteinShake!=='boolean') state.profile.usesProteinShake = false;
  if(!state.mealPlan) state.mealPlan = {status:'idle', result:null, generatedAt:null};

  if(!state.profile.dailyTrainingTimes || typeof state.profile.dailyTrainingTimes!=='object' || Object.keys(state.profile.dailyTrainingTimes).length===0){
    const fallback = state.profile.trainingTime || 'AM';

// Existing clients already have a saved program with rest times generated under
// the old uniform-per-day scheme. Recompute every exercise's rest time using the
// current compound/isolation rule, so existing clients get the update too, not
// just newly onboarded ones.
function normalizeProgramRestTimes(){
  if(!Array.isArray(state.program)) return;
  const bodyMods = applyBodyTypeModifiers(state.profile.bodyType);
  const goalsList = (Array.isArray(state.profile.goals) && state.profile.goals.length) ? state.profile.goals : (state.profile.goal ? [state.profile.goal] : ['recomp']);
  state.program.forEach(day=>{
    (day.exercises||[]).forEach(ex=>{
      if(ex.muscle === 'Conditioning') return; // leave the cardio finisher alone
      ex.restSec = restSecForExercise(ex.name, goalsList, bodyMods);
    });
  });
}
// Migrates any client saved before the baseline/target/check-in photo redesign
// (old shape: photos:{front,side,rear,target}, analysis:{status,result}) into the
// current nested shape, so existing clients' data loads instead of crashing the app.

      checkins: (old.checkins && typeof old.checkins==='object') ? old.checkins : {}

// Formats a Date using its LOCAL calendar date (year/month/day as the user's
// clock actually shows them) — deliberately not toISOString(), which converts
// through UTC first and can silently roll the date back a day for anyone in a
// positive UTC-offset timezone (e.g. UK during British Summer Time, UTC+1).
function toLocalISODate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const todayISO = ()=> toLocalISODate(new Date());
const fmt1 = (n)=> Math.round(n*10)/10;
function addDaysISO(dateStr, days){
  const d = new Date((dateStr||todayISO())+'T00:00:00');
  if(isNaN(d.getTime())) return todayISO();
  d.setDate(d.getDate()+days);
  return toLocalISODate(d);
}
function formatCalendarDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-GB', {weekday:'short', month:'short', day:'numeric'});
}
function startOfMonth(dateStr){
  const d = new Date((dateStr||todayISO())+'T00:00:00');
  if(isNaN(d.getTime())) return startOfMonth(todayISO());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function endOfMonth(dateStr){
  const d = new Date((dateStr||todayISO())+'T00:00:00');
  if(isNaN(d.getTime())) return endOfMonth(todayISO());
  const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return toLocalISODate(end);
}
function addMonthsISO(dateStr, months){
  const d = new Date((dateStr||todayISO())+'T00:00:00');
  if(isNaN(d.getTime())) return addMonthsISO(todayISO(), months);
  d.setMonth(d.getMonth()+months);
  return toLocalISODate(d);
}

function resizeImageFile(file, maxDim=640){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w=maxDim; }
        else if(h>maxDim){ w = Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================= CALCULATIONS ============================= */
const ACTIVITY_MULT = {
  'Sedentary':1.2, 'Light':1.375, 'Moderate':1.55, 'Heavy':1.725, 'Athlete':1.9
};
function calcBMR(p){
  const w = parseFloat(p.weightKg), h = heightCm(p), age = parseFloat(p.ageYears)||0;
  if(p.gender==='male') return 10*w + 6.25*h - 5*age + 5;
  return 10*w + 6.25*h - 5*age - 161;
}
function heightCm(p){
  const ft = parseFloat(p.heightFt)||0, inch = parseFloat(p.heightIn)||0;
  return Math.round(((ft*12)+inch) * 2.54 * 10)/10;
}
function kgToLbs(kg){ return fmt1(kg*2.20462); }
// Set-logging weight is always stored internally in kg (for consistent overload math and
// charts) but displayed/entered in whichever unit the client prefers.
function toDisplayWeight(kgVal, unit){
  if(kgVal===''||kgVal==null||isNaN(parseFloat(kgVal))) return '';
  const kg = parseFloat(kgVal);
  return unit==='lbs' ? fmt1(kg*2.20462) : fmt1(kg);
}
function toStorageWeightKg(displayVal, unit){
  if(displayVal===''||displayVal==null||isNaN(parseFloat(displayVal))) return '';
  const v = parseFloat(displayVal);
  return unit==='lbs' ? fmt1(v/2.20462) : fmt1(v);
}
function kgToStone(kg){
  const totalLbs = kg*2.20462;
  const st = Math.floor(totalLbs/14);
  const lb = fmt1(totalLbs - st*14);
  return {st, lb};
}
/* ---- Body measurements: unit conversion + inferred insights ---- */
function measurementToCm(value, unit){
  const v = parseFloat(value);
  if(!v && v!==0) return null;
  return unit==='in' ? fmt1(v*2.54) : fmt1(v);
}
function measurementFromCm(cmValue, unit){
  if(cmValue==null) return null;
  return unit==='in' ? fmt1(cmValue/2.54) : fmt1(cmValue);
}
// Standard published waist-circumference risk bands (NHS/WHO general population
// guidance) — informational only, not a diagnosis, and explicitly framed that way
// wherever it's shown. Gender-specific because the thresholds are.
function waistCategory(waistCm, gender){
  if(!waistCm) return null;
  if(gender==='female'){
    if(waistCm < 80) return {level:'healthy', label:'Within general healthy-range guidance'};
    if(waistCm < 88) return {level:'increased', label:'Above general healthy-range guidance'};
    return {level:'high', label:'Well above general healthy-range guidance'};
  }
  // default to male thresholds if gender unset/other, since some baseline is
  // more useful than silently showing nothing
  if(waistCm < 94) return {level:'healthy', label:'Within general healthy-range guidance'};
  if(waistCm < 102) return {level:'increased', label:'Above general healthy-range guidance'};
  return {level:'high', label:'Well above general healthy-range guidance'};
}
// Pulls together whatever measurements exist into a short set of descriptive,
// non-diagnostic insights for display. Returns null if no usable measurements.
function measurementInsights(profile){
  const m = profile.measurements;
  if(!m) return null;
  const unit = m.unit || 'cm';
  const chestCm = measurementToCm(m.chest, unit);
  const waistCm = measurementToCm(m.waist, unit);
  const thighCm = measurementToCm(m.thigh, unit);
  const bicepCm = measurementToCm(m.bicep, unit);
  if(!chestCm && !waistCm && !thighCm && !bicepCm) return null;

  const insights = [];
  const cat = waistCategory(waistCm, profile.gender);
  if(cat){
    insights.push({
      label:'Waist circumference',
      text:`${cat.label} (general population guidance, not a personal diagnosis — worth discussing with a doctor if you have concerns).`,
      level:cat.level
    });
  }
  if(chestCm && waistCm){
    const ratio = fmt1(chestCm/waistCm);
    let note;
    if(ratio >= 1.25) note = 'a pronounced chest-to-waist taper';
    else if(ratio >= 1.1) note = 'a moderate chest-to-waist taper';
    else note = 'a fairly even chest-to-waist ratio';
    insights.push({label:'Chest : Waist ratio', text:`${ratio} : 1 — ${note}. A common physique reference point, not a health measure.`, level:'info'});
  }
  return insights.length ? insights : null;
}
// Occupational NEAT varies meaningfully independent of structured exercise —
// a desk job vs. a physically demanding job affects total daily energy expenditure.
const WORK_NEAT_KCAL = {
  'Sedentary Office Work': 0,
  'Moderate Physical Exertion': 150,
  'High Physical Exertion': 350
};
function calcTargets(p){
  const bmr = calcBMR(p);
  const tdee = bmr * (ACTIVITY_MULT[p.activityLevel]||1.375) + (WORK_NEAT_KCAL[p.work]||0);
  const w = parseFloat(p.weightKg);
  const bodyMods = applyBodyTypeModifiers(p.bodyType);
  const deficitFrac = 0.20 * bodyMods.deficitMult;   // base 20% deficit, nudged by body type
  const surplusFrac = 0.12 * bodyMods.surplusMult;   // base 12% surplus, nudged by body type

  function macroSet(calories, proteinPerKg, fatPct){
    const proteinG = Math.round(proteinPerKg * w);
    const proteinCal = proteinG*4;
    const fatCal = calories*fatPct;
    const fatG = Math.round(fatCal/9);
    const carbCal = Math.max(calories - proteinCal - fatCal, 0);
    const carbG = Math.round(carbCal/4);
    return {
      calories: Math.round(calories),
      protein:{g:proteinG, pct:Math.round(proteinCal/calories*100)},
      carbs:{g:carbG, pct:Math.round(carbCal/calories*100)},
      fat:{g:fatG, pct:Math.round(fatCal/calories*100)}
    };
  }
  return {
    bmr:Math.round(bmr), tdee:Math.round(tdee),
    cutting: macroSet(tdee*(1-deficitFrac), 2.2, 0.28),
    maintenance: macroSet(tdee, 1.8, 0.30),
    bulking: macroSet(tdee*(1+surplusFrac), 1.8, 0.27)
  };
}
function goalToCalorieKey(goal){
  if(goal==='fatloss') return 'cutting';
  if(goal==='muscle') return 'bulking';
  if(goal==='recomp') return 'maintenance';
  if(goal==='strength') return 'maintenance';
  if(goal==='endurance') return 'maintenance';
  return 'maintenance';
}
// Multi-goal aware version: fat loss + muscle together reads as a recomposition
// approach (maintenance calories, not a straight cut or bulk); fat loss alone
// keeps a deficit; muscle alone keeps a surplus; everything else defaults to
// maintenance, which is the safest baseline when goals don't imply a clear
// calorie direction (strength/recomp/endurance, alone or combined).
function goalsToCalorieKey(goals){
  const g = Array.isArray(goals) ? goals : (goals ? [goals] : []);
  if(g.includes('fatloss') && g.includes('muscle')) return 'maintenance';
  if(g.includes('fatloss')) return 'cutting';
  if(g.includes('muscle')) return 'bulking';
  return 'maintenance';
}
function goalsLabel(goals){
  const g = Array.isArray(goals) ? goals : (goals ? [goals] : []);
  if(g.length===0) return '';
  return g.map(k=>{ const found = GOALS.find(x=>x.key===k); return found ? found.label : k; }).join(' + ');
}
// Effective calorie key for the current profile, blending across every
// selected goal (with a fallback to the legacy single-goal field for any
// client whose data predates multi-select).
function profileCalorieKey(profile){
  const goalsList = (Array.isArray(profile.goals) && profile.goals.length) ? profile.goals : (profile.goal ? [profile.goal] : []);
  return goalsToCalorieKey(goalsList);
}

// Compound lifts (multi-joint, multiple muscle groups) get longer rest for full
// recovery between heavy efforts; isolation moves (single-joint, one muscle group)
// get shorter rest since they're less taxing on the CNS. Anything not listed here
// defaults to isolation-length rest as the safer/shorter option.
const COMPOUND_EXERCISE_NAMES = new Set([
  'Barbell Bench Press','Overhead Press','Incline Dumbbell Press','Dips','Machine Chest Press','Arnold Press',
  'Deadlift','Pull-Up','Barbell Row','Seated Cable Row','T-Bar Row','Chest-Supported Row',
  'Back Squat','Romanian Deadlift','Leg Press','Walking Lunge','Front Squat','Hip Thrust',
  'Dumbbell Bench Press','Dumbbell Shoulder Press','Incline Push-Up','Bench Dip','Dumbbell Floor Press','Dumbbell Arnold Press','Close-Grip Push-Up',
  'Single-Arm Dumbbell Row','Resistance Band Pulldown','Dumbbell Deadlift','Renegade Row',
  'Dumbbell Goblet Squat','Dumbbell Romanian Deadlift','Bulgarian Split Squat','Dumbbell Walking Lunge','Glute Bridge','Dumbbell Step-Up','Single-Leg Hip Thrust','Dumbbell Sumo Squat',
  'Push-Up','Pike Push-Up','Diamond Push-Up','Decline Push-Up','Archer Push-Up','Wall Handstand Push-Up','Chair Tricep Dip',
  'Inverted Row','Doorframe Row','Chin-Up','Towel Row',
  'Bodyweight Squat','Single-Leg Glute Bridge','Jump Squat','Step-Up','Single-Leg RDL'
]);
function isCompoundExercise(name){
  return COMPOUND_EXERCISE_NAMES.has(name);
}
// Base rest by training goal, scaled within the required bounds:
// compound lifts 120-180s (2-3 min), isolation lifts 90-150s (1:30-2:30).
const COMPOUND_REST_BY_GOAL = {fatloss:120, muscle:150, strength:180, recomp:135, endurance:120};
const ISOLATION_REST_BY_GOAL = {fatloss:90, muscle:120, strength:150, recomp:105, endurance:90};
function restSecForExercise(name, goals, bodyMods){
  const g = Array.isArray(goals) ? goals : (goals ? [goals] : []);
  const list = g.length ? g : ['recomp'];
  const compound = isCompoundExercise(name);
  const table = compound ? COMPOUND_REST_BY_GOAL : ISOLATION_REST_BY_GOAL;
  const base = Math.round(list.reduce((sum,gl)=> sum + (table[gl]||150), 0) / list.length);
  const withMods = base + ((bodyMods && bodyMods.restAddSec) || 0);
  const lo = compound ? 120 : 90;
  const hi = compound ? 180 : 150;
  return Math.max(lo, Math.min(hi, withMods));
}
function goalScheme(goal){
  const schemes = {
    fatloss:{sets:3, reps:'10-15', rir:'1-2', restSec:60, label:'Fat Loss'},
    muscle:{sets:4, reps:'8-12', rir:'1-3', restSec:90, label:'Hypertrophy'},
    strength:{sets:5, reps:'3-6', rir:'1-3', restSec:180, label:'Strength'},
    recomp:{sets:3, reps:'8-12', rir:'1-2', restSec:75, label:'Recomposition'},
    endurance:{sets:3, reps:'15-20', rir:'2-3', restSec:40, label:'Muscular Endurance'}
  };
  return schemes[goal] || schemes.recomp;
}
// Blends multiple selected goals into one coherent set/rep/RIR prescription:
// sets are averaged, rep and RIR ranges are widened to span every selected
// goal's range (e.g. Strength + Hypertrophy -> a 3-12 rep range covering both),
// rather than one goal silently overriding the others.
function blendedGoalScheme(goals){
  const g = Array.isArray(goals) ? goals.filter(Boolean) : (goals ? [goals] : []);
  const list = g.length ? g : ['recomp'];
  const schemes = list.map(goalScheme);
  const avgSets = Math.round(schemes.reduce((s,x)=>s+x.sets,0) / schemes.length);
  const repBounds = schemes.map(x=>parseRepRange(x.reps));
  const repMin = Math.min(...repBounds.map(b=>b.min));
  const repMax = Math.max(...repBounds.map(b=>b.max));
  const rirBounds = schemes.map(x=>parseRepRange(x.rir));
  const rirMin = Math.min(...rirBounds.map(b=>b.min));
  const rirMax = Math.max(...rirBounds.map(b=>b.max));
  return {
    sets: avgSets,
    reps: repMin===repMax ? `${repMin}` : `${repMin}-${repMax}`,
    rir: rirMin===rirMax ? `${rirMin}` : `${rirMin}-${rirMax}`,
    label: list.map(gl=>goalScheme(gl).label).join(' + ')
  };
}
function buildProgram(p){
  const days = parseInt(p.daysPerWeek)||3;
  const lib = EX[p.equipment] || EX.gym;
  const goalsList = (Array.isArray(p.goals) && p.goals.length) ? p.goals : (p.goal ? [p.goal] : ['recomp']);
  const baseScheme = blendedGoalScheme(goalsList);
  const bodyMods = applyBodyTypeModifiers(p.bodyType);
  const expMods = applyExperienceModifiers(p.trainingExperience);
  const scheme = {
    sets: Math.max(2, Math.min(6, Math.round(baseScheme.sets * bodyMods.volumeMult * expMods.volumeMult))),
    reps: baseScheme.reps,
    rir: baseScheme.rir,
    label: baseScheme.label
  };
  const exCount = Math.max(3, Math.min(9, Math.floor((parseInt(p.sessionMins)||60)/9) + expMods.exerciseCountAdjust));

  let template;
  if(days<=2) template = [{name:'Full Body A', pool:'full'},{name:'Full Body B', pool:'full'}];
  else if(days===3) template = [{name:'Full Body A', pool:'full'},{name:'Full Body B', pool:'full'},{name:'Full Body C', pool:'full'}];
  else if(days===4) template = [{name:'Upper A', pool:['push','pull']},{name:'Lower A', pool:'legs'},{name:'Upper B', pool:['push','pull']},{name:'Lower B', pool:'legs'}];
  else if(days===5) template = [{name:'Push', pool:'push'},{name:'Pull', pool:'pull'},{name:'Legs', pool:'legs'},{name:'Upper', pool:['push','pull']},{name:'Lower', pool:'legs'}];
  else template = [{name:'Push A', pool:'push'},{name:'Pull A', pool:'pull'},{name:'Legs A', pool:'legs'},{name:'Push B', pool:'push'},{name:'Pull B', pool:'pull'},{name:'Legs B', pool:'legs'}].slice(0,days);

  const occurrence = {};
  return template.map((day)=>{
    let pool = [];
    if(Array.isArray(day.pool)){
      const lists = day.pool.map(k=> lib[k].slice());
      const maxLen = Math.max(...lists.map(l=>l.length));
      for(let i=0;i<maxLen;i++){
        lists.forEach(l=>{ if(l[i]) pool.push(l[i]); });
      }
    }
    else { pool = lib[day.pool].slice(); }
    // rotate based on how many times this exact split-type (e.g. 'push,pull' or 'legs')
    // has already appeared in the week, so e.g. Upper A and Upper B don't pull identical exercises
    const poolKey = Array.isArray(day.pool) ? day.pool.join(',') : day.pool;
    const occ = occurrence[poolKey] || 0;
    occurrence[poolKey] = occ + 1;
    const offset = pool.length ? (occ * Math.max(1, Math.floor(pool.length/2))) % pool.length : 0;
    const rotated = pool.slice(offset).concat(pool.slice(0, offset));
    const chosen = rotated.slice(0, exCount);
    const exercises = chosen.map(e=>({
      name:e.n, muscle:e.m, sets:scheme.sets, repRange:scheme.reps, rir:scheme.rir, restSec:restSecForExercise(e.n, goalsList, bodyMods)
    }));
    // Endomorph modifier: add a conditioning finisher, since higher NEAT/cardio inclusion
    // is a reasonable, low-risk addition regardless of resistance-training goal.
    if(bodyMods.conditioning){
      exercises.push({
        name:'Conditioning Finisher (incline walk, bike, or rower)', muscle:'Conditioning',
        sets:1, repRange:'10–15 min steady', rir:'RPE 5–6', restSec:60
      });
    }
    return { name: day.name, exercises };
  });
}

/* ============================= PROGRESSIVE OVERLOAD ============================= */
function parseRepRange(repRange){
  const m = /(\d+)\s*[-–]\s*(\d+)/.exec(repRange||'');
  if(m) return {min:parseInt(m[1]), max:parseInt(m[2])};
  const single = /(\d+)/.exec(repRange||'');
  if(single) return {min:parseInt(single[1]), max:parseInt(single[1])};
  return {min:0, max:999};
}
function suggestNextWeight(dayName, exerciseName, repRange){
  const entries = Object.values(state.logs.workouts)
    .filter(w=>w.dayName===dayName && w.exercises[exerciseName])
    .sort((a,b)=> a.date < b.date ? 1 : -1);
  if(entries.length===0) return null;
  const lastSets = entries[0].exercises[exerciseName].filter(s=>s.done && s.weight);
  if(lastSets.length===0) return null;
  const avgRpe = lastSets.reduce((s,x)=>s+(parseFloat(x.rpe)||8),0)/lastSets.length;
  const avgReps = lastSets.reduce((s,x)=>s+(parseFloat(x.reps)||0),0)/lastSets.length;
  const maxWeight = Math.max(...lastSets.map(s=>parseFloat(s.weight)||0));
  const {min:repMin, max:repMax} = parseRepRange(repRange);

  let mult, reason;
  if(avgReps < repMin){
    mult = 0.95; reason = 'reps fell short of target range — slight decrease to hit reps next time';
  } else if(avgRpe >= 9.5){
    mult = 0.95; reason = 'RPE was very high — small deload';
  } else if(avgReps >= repMax && avgRpe <= 8){
    mult = 1.05; reason = 'hit the top of the rep range with room to spare — increase load';
  } else if(avgRpe <= 7){
    mult = 1.05; reason = 'RPE was low for the reps achieved — increase load';
  } else if(avgRpe <= 8.5){
    mult = 1.02; reason = 'solid effort — small increase';
  } else {
    mult = 1.0; reason = 'right at target — repeat this weight';
  }
  // Scale how big that jump (or deload) is by training experience: novices tend
  // to adapt faster and can handle bigger week-to-week jumps ("newbie gains"),
  // while advanced lifters progress more conservatively as gains slow down.
  // Intermediate is the calibration baseline, so it applies no scaling at all.
  const expScale = applyExperienceModifiers(state.profile.trainingExperience).progressionScale;
  mult = 1 + (mult - 1) * expScale;
  return { suggested: fmt1(maxWeight*mult), lastWeight:maxWeight, lastRpe:fmt1(avgRpe), lastReps:fmt1(avgReps), reason };
}

}
async function setupCoachCode(code){
  gateSetupError = null;
  if(code.length<4){ gateSetupError='Coach code should be at least 4 characters.'; render(); return; }
  gateBusy = true; render();
  // re-check in case a coach was configured elsewhere moments ago
  try{
    const m = await window.storage.get('coach-configured', true);
    if(m && m.value){
      coachConfigured = true; gateBusy = false;
      gateSetupError = 'A coach code already exists for this app — ask the coach for the login code instead.';
      render(); return;
    }
  }catch(e){}
  const hash = await sha256Hex('coach:'+code);
  try{
    await window.storage.set('coach-auth-'+hash, 'true', true);
    await window.storage.set('coach-configured', 'true', true);
  }catch(e){}
  // Verify the write actually persisted rather than assuming it did — if the platform
  // showed a "this app wants to save shared data" prompt and it was declined, the
  // write can silently fail to stick even though nothing throws an error here.
  let confirmed = false;
  try{
    const check = await window.storage.get('coach-auth-'+hash, true);
    confirmed = !!(check && check.value);
  }catch(e){ confirmed = false; }
  gateBusy = false;
  if(!confirmed){
    gateSetupError = "Your coach code didn't save — check your internet connection and try again. If it keeps happening, the Firestore database rules may need to be set to allow read/write access.";
    render();
    return;
  }
  coachConfigured = true;
  gateSetupError = null;
  submitCode(code);
}
async function submitCode(code){
  gateSubmitError = null;
  if(!code){ gateSubmitError='Enter a code.'; render(); return; }
  gateBusy = true; render();
  const isCoach = await tryCoachLogin(code);
  if(isCoach){
    session = {role:'coach', clientId:null, clientName:null, viewingAsCoach:false};
    await loadRoster(); // safe now — coach has proven they know the coach code
    gateError = null; gateSubmitError = null; gateBusy = false;
    render();
    return;
  }
  const clientId = await tryClientLogin(code);
  if(clientId){
    session = {role:'client', clientId, clientName:null, viewingAsCoach:false};
    await loadClientState(clientId);
    session.clientName = state.profile.name || null;
    gateError = null; gateSubmitError = null; gateBusy = false;
    render();
    return;
  }
  gateBusy = false;
  gateSubmitError = "That code wasn't recognized.";
  render();
}

async function fetchClientData(id){
  let profileData=null, logs={workouts:{},bodyweight:[],food:{}};
  try{
    const d = await window.storage.get(clientDataKey(id), true);
    if(d && d.value){
      const parsed = JSON.parse(d.value);
      logs = parsed.logs || logs;
      profileData = {
        onboarded:parsed.onboarded, profile:parsed.profile, program:parsed.program,
        targets:parsed.targets, analysis:parsed.analysis, photos:parsed.photos
      };
    }
  }catch(e){}
  return {profileData, logs};
}
function summarizeClient(profileData, logs){
  if(!profileData || !profileData.onboarded) return {status:'pending'};
  const dates = [];
  Object.values(logs.workouts||{}).forEach(w=>{
    const hasDone = Object.values(w.exercises||{}).some(sets=>sets.some(s=>s.done));
    if(hasDone) dates.push(w.date);
  });
  (logs.bodyweight||[]).forEach(e=>dates.push(e.date));
  Object.keys(logs.food||{}).forEach(d=>dates.push(d));
  dates.sort();
  const lastLog = dates.length ? dates[dates.length-1] : null;
  const daysSince = lastLog ? Math.floor((new Date(todayISO())-new Date(lastLog))/86400000) : null;

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
  const sessionCount = Object.values(logs.workouts||{}).filter(w=>{
    const hasDone = Object.values(w.exercises||{}).some(sets=>sets.some(s=>s.done));
    return hasDone && new Date(w.date) >= cutoff;
  }).length;

  const bw = [...(logs.bodyweight||[])].sort((a,b)=>a.date<b.date?-1:1);
  let trend = null;
  if(bw.length>=2){ trend = fmt1(bw[bw.length-1].weightKg - bw[0].weightKg); }

  return {
    status: daysSince===null ? 'no-data' : (daysSince>=5 ? 'stale' : 'active'),
    lastLog, daysSince, sessionCount,
    targetSessions: parseInt(profileData.profile.daysPerWeek)||0,
    trend, goal: profileData.profile.goal
  };
}

function computeNutritionSuggestion(){
  const bw = [...(state.logs.bodyweight||[])].sort((a,b)=>a.date<b.date?-1:1);
  const recent = bw.slice(-14);
  if(recent.length<4) return null;
  const mid = Math.floor(recent.length/2);
  const firstHalfAvg = recent.slice(0,mid).reduce((a,e)=>a+e.weightKg,0)/mid;
  const secondHalfAvg = recent.slice(mid).reduce((a,e)=>a+e.weightKg,0)/(recent.length-mid);
  const delta = fmt1(secondHalfAvg-firstHalfAvg);
  const goalsList = (Array.isArray(state.profile.goals) && state.profile.goals.length) ? state.profile.goals : (state.profile.goal ? [state.profile.goal] : []);
  if(goalsList.includes('fatloss') && delta > -0.2){
    return {text:`Weight trend is roughly flat (${delta}kg) over the recent logging window despite a fat-loss goal. Consider reducing target calories by ~150kcal/day.`, amount:-150};
  }
  if(goalsList.includes('muscle') && delta < 0.1){
    return {text:`Weight trend is roughly flat (${delta}kg) over the recent logging window despite a muscle-gain goal. Consider adding ~150kcal/day.`, amount:150};
  }
  return null;
}
function applyNutritionSuggestion(sugg){
  const calKey = profileCalorieKey(state.profile);
  const t = state.targets[calKey];
  t.calories += sugg.amount;
  const proteinCal = t.protein.g*4, fatCal = t.fat.g*9;
  const carbCal = Math.max(t.calories - proteinCal - fatCal, 0);
  t.carbs.g = Math.round(carbCal/4);
  t.carbs.pct = Math.round(carbCal/t.calories*100);
  t.protein.pct = Math.round(proteinCal/t.calories*100);
  t.fat.pct = Math.round(fatCal/t.calories*100);
  queueSave();
  render();
}
async function generateCheckinDraft(){
  checkinStatus = 'loading'; render();
  try{
    const bw = [...(state.logs.bodyweight||[])].sort((a,b)=>a.date<b.date?-1:1);
    const latestWeight = bw.length ? bw[bw.length-1].weightKg : null;
    const weightChange = bw.length>=2 ? fmt1(bw[bw.length-1].weightKg - bw[0].weightKg) : null;
    const sessionsLogged = Object.values(state.logs.workouts||{}).filter(w=>Object.values(w.exercises||{}).some(sets=>sets.some(x=>x.done))).length;
    const foodDaysLogged = Object.keys(state.logs.food||{}).length;

    const prompt = `You are a supportive, professional personal trainer writing a short weekly check-in message to your client ${state.profile.name||'the client'}, whose goal(s) are ${goalsLabel(state.profile.goals) || state.profile.goal || 'general fitness'}.
Data: latest bodyweight ${latestWeight!=null?latestWeight+'kg':'not logged'}, change since first log ${weightChange!=null?weightChange+'kg':'not enough data yet'}, ${sessionsLogged} workout sessions logged, ${foodDaysLogged} days of food logged recently.
Write a warm, encouraging, specific 3-4 sentence check-in message the coach can send directly to the client via text message. Mention one concrete positive and one gentle, actionable focus for next week. No emojis. No clinical or diagnostic language. Respond with only the message text, nothing else.`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:400, messages:[{role:'user', content:prompt}]})

    const data = await response.json();

function validateStep(step, p){
  if(step===0){
    if(!p.gender) return 'Please select a gender — needed for an accurate calorie calculation.';
    if(!p.ageYears || parseFloat(p.ageYears)<=0) return 'Please enter your age.';
  }
  else if(step===1){

  }
  else if(step===3){
    if(!p.goals || p.goals.length===0) return 'Please select at least one goal — this drives your whole program.';
  }
  else if(step===8){
    if(!p.trainingExperience) return 'Please select your training experience level.';
  }
  else if(step===4){
    if(!p.work) return 'Please select your day-to-day work type.';
    if(!p.activityLevel) return 'Please select your activity level.';
  }
  else if(step===5){
    if(!p.daysPerWeek || parseInt(p.daysPerWeek)<=0) return 'Please enter how many days you can train.';
    if(!p.sessionMins || parseInt(p.sessionMins)<=0) return 'Please enter your session length.';

  }
  return null; // steps 2 (body type), 6 (diet) and 7 (photos) stay optional

const BODY_TYPES = [
  {
    key:'ectomorph', label:'Ectomorph',
    desc:'Naturally lean frame, tends to gain weight and muscle slowly.'
  },
  {
    key:'mesomorph', label:'Mesomorph',
    desc:'Athletic, balanced build — tends to gain and lose weight relatively easily.'
  },
  {
    key:'endomorph', label:'Endomorph',
    desc:'Broader frame, tends to gain weight (muscle and fat) relatively easily.'
  }
];
// Picks the icon set matching the client's selected gender; falls back to the
// male set if gender hasn't been chosen yet (body type is asked after gender
// in onboarding, so this fallback should rarely if ever be hit in practice).
function bodyTypeIconSvg(bodyTypeKey, gender){
  const set = BODY_TYPE_ICONS[gender] || BODY_TYPE_ICONS.male;
  const raw = set[bodyTypeKey] || '';
  return raw.replace('<svg ', '<svg class="mx-auto" width="44" height="74" ');
}
// Small, transparent nudges applied on top of the base evidence-based defaults.
// Intentionally modest — the dominant driver of programming stays goal + logged progress.
function applyBodyTypeModifiers(bodyType){
  const mods = {
    ectomorph: {surplusMult:1.4, deficitMult:0.85, volumeMult:0.9, restAddSec:15, conditioning:false},
    mesomorph: {surplusMult:1.0, deficitMult:1.0, volumeMult:1.0, restAddSec:0, conditioning:false},
    endomorph: {surplusMult:0.85, deficitMult:1.15, volumeMult:1.08, restAddSec:-10, conditioning:true}
  };
  return mods[bodyType] || mods.mesomorph;
}

// Training experience — factored into overall volume, how many exercises fit
// into a session, and how aggressively week-to-week progression is applied.
// Intermediate is the calibration baseline the rest of the app's defaults are
// built around, so it stays neutral (1x) on every dimension.
const EXPERIENCE_LEVELS = [
  {
    key:'novice', label:'Novice',
    desc:"New to structured training, or returning after a long break (roughly under 6 months of consistent lifting). Program uses lower overall volume and fewer exercises per session while movement patterns are still being learned, with faster week-to-week progression since early gains tend to come quickly."
  },
  {
    key:'intermediate', label:'Intermediate',
    desc:"Training consistently for roughly 6 months to 2 years, comfortable with the main lifts and already applying progressive overload. This is the baseline the app's defaults are calibrated around."
  },
  {
    key:'advanced', label:'Advanced',
    desc:"2+ years of consistent, structured training with a solid technical base. Program uses higher overall volume and more exercises per session to match greater work capacity, with more conservative week-to-week progression since gains come more slowly at this stage."
  }
];
function applyExperienceModifiers(level){
  const mods = {
    novice: {volumeMult:0.8, exerciseCountAdjust:-1, progressionScale:1.3},
    intermediate: {volumeMult:1.0, exerciseCountAdjust:0, progressionScale:1.0},
    advanced: {volumeMult:1.15, exerciseCountAdjust:1, progressionScale:0.7}
  };
  return mods[level] || mods.intermediate;
}

function renderOnboarding(){
  const wrap = el(`<div class="pt-10 max-w-2xl mx-auto"></div>`);
  wrap.appendChild(el(`
    <div class="mb-8 text-center relative">
      <button id="resetBtnOnboard" class="absolute right-0 top-0 text-xs font-mono text-[var(--ink-2)] hover:text-[var(--alert)] underline underline-offset-2">Reset</button>
      <div class="label">Setup — step ${state.step+1} of ${TOTAL_STEPS}</div>
      <h1 class="font-display text-3xl font-bold mt-1">Build Your System</h1>
    </div>
  `));
  wrap.querySelector('#resetBtnOnboard').onclick = resetAllData;
  const progressWrap = el(`<div class="progress-track mb-2"></div>`);
  progressWrap.appendChild(el(`<div class="progress-fill" style="width:${(state.step+1)/TOTAL_STEPS*100}%; background:var(--chalk);"></div>`));
  wrap.appendChild(progressWrap);
  wrap.appendChild(el(`<div class="text-xs text-[var(--ink-2)] text-right mb-6">* required for an accurate plan</div>`));

  const card = el(`<div class="card p-5 sm:p-8"></div>`);
  const p = state.profile;

  if(state.step===0){
    const themeRow = el(`<div class="flex items-center justify-between mb-5 p-3 rounded-lg" style="background:var(--bg-2);"></div>`);
    themeRow.appendChild(el(`<div class="label">App Appearance</div>`));
    const themeToggle = el(`<div class="flex gap-1"></div>`);
    [['dark','Dark'],['light','Light']].forEach(([val,label])=>{
      const b = el(`<button class="px-4 py-1.5 rounded text-xs ${(p.theme||'dark')===val?'btn-chalk':'btn-ghost'}">${label}</button>`);
      b.onclick = ()=>{ p.theme=val; preLoginTheme=val; setStoredTheme(val); applyTheme(); render(); };
      themeToggle.appendChild(b);
    });
    themeRow.appendChild(themeToggle);
    card.appendChild(themeRow);
    card.appendChild(el(`<h2 class="font-display text-xl mb-4">Who's Training?</h2>`));
    card.appendChild(field('Name', inputText(p.name, v=>p.name=v, 'Your first name')));
    card.appendChild(field('Gender *', selectEl(['','male','female'], p.gender, v=>{p.gender=v; render();}, ['Select…','Male','Female'])));
    const ageRow = el(`<div class="grid grid-cols-2 gap-3"></div>`);
    ageRow.appendChild(field('Age — Years *', inputNum(p.ageYears, v=>p.ageYears=v)));
    ageRow.appendChild(field('Age — Months', inputNum(p.ageMonths, v=>p.ageMonths=v)));
    card.appendChild(ageRow);
  }
  else if(state.step===1){
    card.appendChild(el(`<h2 class="font-display text-xl mb-4">Body Stats</h2>`));
    const weightHint = el(`<div class="text-xs font-mono text-[var(--ink-2)] -mt-3 mb-3">${p.weightKg ? (()=>{const st=kgToStone(parseFloat(p.weightKg)); return `≈ ${st.st}st ${st.lb}lb`;})() : ''}</div>`);
    const weightInput = inputNum(p.weightKg, v=>{
      p.weightKg = v;
      weightHint.textContent = v ? (()=>{const st=kgToStone(parseFloat(v)); return `≈ ${st.st}st ${st.lb}lb`;})() : '';
    });
    card.appendChild(field('Weight (kg) *', weightInput));
    card.appendChild(weightHint);
    const heightHint = el(`<div class="text-xs font-mono text-[var(--ink-2)] -mt-3 mb-3">${p.heightFt ? `≈ ${heightCm(p)} cm` : ''}</div>`);
    function updateHeightHint(){ heightHint.textContent = p.heightFt ? `≈ ${heightCm(p)} cm` : ''; }
    const heightFtInput = inputNum(p.heightFt, v=>{ p.heightFt=v; updateHeightHint(); });
    const heightInInput = inputNum(p.heightIn, v=>{ p.heightIn=v; updateHeightHint(); });
    const hRow = el(`<div class="grid grid-cols-2 gap-3"></div>`);
    hRow.appendChild(field('Height — Feet *', heightFtInput));
    hRow.appendChild(field('Height — Inches', heightInInput));
    card.appendChild(hRow);
    card.appendChild(heightHint);
    card.appendChild(field('Body Fat % (optional — leave blank to estimate from photo later)', inputNum(p.bodyFatPct, v=>p.bodyFatPct=v)));

    card.appendChild(el(`<div class="chalk-rule my-4"></div>`));
    card.appendChild(el(`<div class="label mb-1">Body Measurements (optional)</div>`));
    card.appendChild(el(`<p class="text-xs text-[var(--ink-2)] mb-3">If you have a tape measure handy, these help build a fuller picture and let progress be tracked beyond just the scale. Skip any you don't have.</p>`));
    const measUnitRow = el(`<div class="flex gap-1 mb-3 text-xs"></div>`);
    ['cm','in'].forEach(u=>{
      const b = el(`<button class="px-3 py-1.5 rounded ${(p.measurements.unit||'cm')===u?'btn-chalk':'btn-ghost'}">${u==='cm'?'Centimetres':'Inches'}</button>`);
      b.onclick = ()=>{ p.measurements.unit=u; render(); };
      measUnitRow.appendChild(b);
    });
    card.appendChild(measUnitRow);
    const measGrid = el(`<div class="grid grid-cols-2 gap-3"></div>`);
    const measUnit = p.measurements.unit||'cm';
    [['chest','Chest'],['waist','Waist'],['thigh','Upper Thigh'],['bicep','Bicep']].forEach(([key,label])=>{
      measGrid.appendChild(field(`${label} (${measUnit})`, inputNum(p.measurements[key], v=>p.measurements[key]=v)));
    });
    card.appendChild(measGrid);
  }
  else if(state.step===2){
    card.appendChild(el(`<h2 class="font-display text-xl mb-2">Body Type</h2>`));
    card.appendChild(el(`<p class="text-sm text-[var(--ink-2)] mb-4">Pick whichever best matches how your body currently tends to respond to training and food. This is a rough starting point — it makes small tweaks to your volume, rest, calorie targets, and conditioning work. Your own logged results always matter more, and the app adjusts as those come in.</p>`));
    const grid = el(`<div class="grid grid-cols-3 gap-3"></div>`);

function inputText(val, onChange, placeholder=''){

function inputNum(val, onChange, placeholder=''){

function selectEl(values, current, onChange, labels=null){
  const s = el(`<select></select>`);

function handleOnboardNext(){
  if(state.step<TOTAL_STEPS-1){ state.step++; render(); return; }
  // finish
  state.targets = calcTargets(state.profile);
  state.program = buildProgram(state.profile);
  state.onboarded = true;
  state.profile.programStartDate = todayISO();
  state.view='dashboard';
  queueSave();

  const hasTarget = state.photos.target.front || state.photos.target.side || state.photos.target.rear;
  if(hasBaseline && hasTarget){

  }
}

/* ============================= WORKOUT VIEW ============================= */
/* ============================= TRAINING CALENDAR ============================= */
// Spreads the client's chosen days-per-week evenly across a Mon-Sun week to get
// a natural-feeling training pattern (e.g. 3/wk -> Mon/Wed/Fri).
function getTrainingWeekdays(daysPerWeek){
  const n = Math.max(1, Math.min(7, parseInt(daysPerWeek)||3));
  const weekOrder = [1,2,3,4,5,6,0]; // Mon..Sun, using JS Date.getDay() numbering
  const slots = [];
  for(let i=0;i<n;i++){ slots.push(weekOrder[Math.floor(i*7/n)]); }
  return slots;
}
function nextTrainingDateOnOrAfter(dateStr, weekdaySlots){
  let d = dateStr || todayISO();
  if(!Array.isArray(weekdaySlots) || weekdaySlots.length===0) weekdaySlots = [1];
  for(let i=0;i<8;i++){
    const dow = new Date(d+'T00:00:00').getDay();
    if(weekdaySlots.includes(dow)) return d;
    d = addDaysISO(d,1);
  }
  return d;
}
function wasSessionCompleted(dayName, dateStr){
  const log = state.logs.workouts[`${dayName}-${dateStr}`];
  if(!log) return false;
  return Object.values(log.exercises||{}).some(sets=>sets.some(s=>s.done));
}
// Walks day-by-day from the client's program start date through to `daysAhead`
// days from now, assigning each training-weekday slot the next program day in
// rotation. If a past slot has no logged completion, it's marked "missed" and
// that same workout is pushed to the next available slot instead of being
// skipped — which naturally shifts every later session back too. This is fully
// recomputed from the log history each time, so it self-corrects daily with no
// separate schedule state to keep in sync.
function computeAdaptiveSchedule(horizonDate){
  const program = state.program;
  if(!program || program.length===0) return [];
  const weekdaySlots = getTrainingWeekdays(state.profile.daysPerWeek);
  const startDate = state.profile.programStartDate || todayISO();
  const today = todayISO();
  const horizon = horizonDate || addDaysISO(today, 10);

  let pointer = 0;
  let dueDate = nextTrainingDateOnOrAfter(startDate, weekdaySlots);
  const entries = [];
  let cursor = startDate;
  let safety = 0;

  // Phase 1: walk day-by-day up through today. Checking EVERY day (not just the
  // officially-scheduled training weekdays) for a completed session is what lets
  // a client log a workout early/out of pattern and have the whole remaining
  // schedule shift backward in response — not just "not missed", genuinely ahead.
  while(cursor <= today && safety < 2000){
    safety++;
    const day = program[pointer % program.length];
    if(wasSessionCompleted(day.name, cursor)){
      entries.push({date:cursor, dayName:day.name, status:'completed'});
      pointer++;
      dueDate = nextTrainingDateOnOrAfter(addDaysISO(cursor,1), weekdaySlots);
    } else if(cursor === dueDate){
      const status = cursor < today ? 'missed' : 'today';
      entries.push({date:cursor, dayName:day.name, status});
      if(cursor < today){
        // still not done and now in the past — push this same due session
        // forward to the next available slot; pointer stays put since it's
        // still owed, which is what shifts every later session forward too.
        dueDate = nextTrainingDateOnOrAfter(addDaysISO(cursor,1), weekdaySlots);
      }
      // if it's today's slot, leave dueDate/pointer as-is — still due until logged
    }
    cursor = addDaysISO(cursor,1);
  }

  // Phase 2: from the first still-open slot onward, the future is unresolved by
  // definition, so just lay out straightforward upcoming entries in rotation.
  let futureCursor = dueDate;
  let futurePointer = pointer;
  if(futureCursor <= today){
    // today's slot was already added above as 'today' and left unresolved —
    // start the upcoming list from the slot after it instead of repeating it.
    futureCursor = nextTrainingDateOnOrAfter(addDaysISO(today,1), weekdaySlots);
    futurePointer++;
  }
  while(futureCursor <= horizon && safety < 2000){
    safety++;
    const day = program[futurePointer % program.length];
    entries.push({date:futureCursor, dayName:day.name, status:'upcoming'});
    futurePointer++;
    futureCursor = nextTrainingDateOnOrAfter(addDaysISO(futureCursor,1), weekdaySlots);
  }

  return entries;
}

let showCalendar = false;
let calendarViewDate = null; // any date within the currently viewed month; null = current month
const CAL_STATUS_COLOR = {completed:'#2EE6A6', missed:'#FF3B3B', today:'var(--chalk-light)', upcoming:'#B8B7B0'};
const CAL_STATUS_LABEL = {completed:'Completed', missed:'Missed', today:'Today', upcoming:'Upcoming'};

function renderTrainingCalendar(){
  const wrap = el(`<div class="card p-4 mb-4"></div>`);
  const head = el(`<div class="flex items-center justify-between mb-3"></div>`);
  head.appendChild(el(`<div class="label">Training Calendar</div>`));
  const closeBtn = el(`<button class="text-xs text-[var(--ink-2)] hover:text-[var(--chalk)]">Close</button>`);
  closeBtn.onclick = ()=>{ showCalendar=false; calendarViewDate=null; render(); };
  head.appendChild(closeBtn);
  wrap.appendChild(head);

  const viewDate = calendarViewDate || todayISO();
  const monthStart = startOfMonth(viewDate);
  const monthEnd = endOfMonth(viewDate);
  const monthLabel = new Date(monthStart+'T00:00:00').toLocaleDateString('en-GB', {month:'long', year:'numeric'});

  const nav = el(`<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;"></div>`);
  const prevBtn = el(`<button class="btn btn-ghost" style="min-width:44px; min-height:44px; font-size:20px; line-height:1; padding:10px 16px; border-radius:8px;">←</button>`);
  prevBtn.onclick = ()=>{ calendarViewDate = addMonthsISO(monthStart,-1); render(); };
  const todayBtn = el(`<button class="font-display" style="font-weight:600; font-size:14px; padding:0 8px;">${monthLabel}</button>`);
  todayBtn.title = 'Jump to current month';
  todayBtn.onclick = ()=>{ calendarViewDate = null; render(); };
  const nextBtn = el(`<button class="btn btn-ghost" style="min-width:44px; min-height:44px; font-size:20px; line-height:1; padding:10px 16px; border-radius:8px;">→</button>`);
  nextBtn.onclick = ()=>{ calendarViewDate = addMonthsISO(monthStart,1); render(); };
  nav.appendChild(prevBtn); nav.appendChild(todayBtn); nav.appendChild(nextBtn);
  wrap.appendChild(nav);

  // Compute the adaptive schedule out to the end of the viewed month (plus a
  // small buffer) so navigating forward/back always has data to show, even for
  // months with no logged history yet.
  const schedule = computeAdaptiveSchedule(addDaysISO(monthEnd, 3));
  const byDate = {};
  schedule.forEach(e=>{ byDate[e.date] = e; });

  const grid = el(`<div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;"></div>`);
  ['M','T','W','T','F','S','S'].forEach(d=> grid.appendChild(el(`<div class="font-display" style="text-align:center; font-size:14px; font-weight:700; color:var(--ink-1); padding-bottom:4px;">${d}</div>`)));

  const firstDow = new Date(monthStart+'T00:00:00').getDay(); // 0=Sun..6=Sat
  const leadingBlanks = (firstDow===0) ? 6 : firstDow-1; // convert to Mon-first offset
  for(let i=0;i<leadingBlanks;i++){ grid.appendChild(el(`<div></div>`)); }

  const today = todayISO();
  const daysInMonth = parseInt(monthEnd.slice(8,10));
  let cursor = monthStart;
  for(let dayNum=1; dayNum<=daysInMonth; dayNum++){
    const entry = byDate[cursor];
    const isToday = cursor===today;
    const cellStyle = `border-radius:10px; padding:4px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:56px; background:var(--bg-2); ${isToday?'border:2px solid var(--chalk-light);':'border:2px solid transparent;'}`;
    const cell = el(`<div style="${cellStyle}"></div>`);
    cell.appendChild(el(`<div class="font-mono" style="font-size:14px; font-weight:600; color:${isToday?'var(--chalk-light)':'var(--ink-1)'};">${dayNum}</div>`));
    if(entry){
      const color = CAL_STATUS_COLOR[entry.status];
      cell.appendChild(el(`<div style="width:7px; height:7px; border-radius:50%; background:${color}; margin:3px 0; box-shadow:0 0 5px ${color};"></div>`));
      cell.appendChild(el(`<div class="font-mono" style="font-size:10px; font-weight:600; line-height:1.1; color:${color};">${entry.dayName}</div>`));
      cell.style.cursor = 'pointer';
      cell.title = `${entry.dayName} — ${CAL_STATUS_LABEL[entry.status]}`;
      cell.onclick = ()=>{
        const idx = state.program.findIndex(d=>d.name===entry.dayName);
        if(idx>=0){ state.activeDayIndex=idx; showCalendar=false; calendarViewDate=null; state.showingQuoteFor=idx; render(); }
      };
    }
    grid.appendChild(cell);
    cursor = addDaysISO(cursor,1);
  }
  wrap.appendChild(grid);

  const legend = el(`<div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;"></div>`);
  Object.keys(CAL_STATUS_LABEL).forEach(key=>{
    const item = el(`<div class="font-mono" style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--ink-1);"></div>`);
    item.appendChild(el(`<span style="width:9px; height:9px; border-radius:50%; background:${CAL_STATUS_COLOR[key]}; display:inline-block; box-shadow:0 0 5px ${CAL_STATUS_COLOR[key]};"></span>`));
    item.appendChild(el(`<span>${CAL_STATUS_LABEL[key]}</span>`));
    legend.appendChild(item);
  });
  wrap.appendChild(legend);

  wrap.appendChild(el(`<p class="text-xs text-[var(--ink-2)] mt-3">Missed sessions automatically push the rest of the schedule back — nothing is skipped, just shifted.</p>`));
  return wrap;
}

function renderExerciseCard(day, ex, sessionLog){
  if(!sessionLog.exercises[ex.name]){
    sessionLog.exercises[ex.name] = Array.from({length:ex.sets}, ()=>({weight:'',reps:'',rpe:'',done:false}));
  }
  const sets = sessionLog.exercises[ex.name];
  const unit = state.profile.weightUnit || 'kg';
  const suggestion = suggestNextWeight(day.name, ex.name, ex.repRange);

  const card = el(`<div class="card p-4 sm:p-5 mb-4"></div>`);
  const head = el(`<div class="flex items-start justify-between mb-1"></div>`);
  const titleWrap = el(`<div></div>`);
  const link = el(`<a href="${videoLink(ex.name)}" target="_blank" rel="noopener" class="font-display text-lg font-semibold hover:text-[var(--chalk)] underline decoration-[var(--chalk-dim)] decoration-2 underline-offset-4">${ex.name}</a>`);
  titleWrap.appendChild(link);

  head.appendChild(titleWrap);
  card.appendChild(head);

  if(suggestion){
    const suggestedDisplay = toDisplayWeight(suggestion.suggested, unit);
    const lastDisplay = toDisplayWeight(suggestion.lastWeight, unit);
    card.appendChild(el(`<div class="text-xs font-mono text-[var(--ok)] mb-1">↑ Suggested: ${suggestedDisplay}${unit} (last: ${lastDisplay}${unit} × ${suggestion.lastReps} reps @ RPE ${suggestion.lastRpe})</div>`));
    card.appendChild(el(`<div class="text-xs text-[var(--ink-2)] mb-3">${suggestion.reason}</div>`));
  }

  const table = el(`<div class="space-y-2"></div>`);
  const headerRow = el(`<div class="grid grid-cols-12 gap-1.5 text-xs label px-1"><div class="col-span-1">Set</div><div class="col-span-4">Wt (${unit})</div><div class="col-span-3">Reps</div><div class="col-span-2">RPE</div><div class="col-span-2">Done</div></div>`);
  table.appendChild(headerRow);

  sets.forEach((s, idx)=>{
    const row = el(`<div class="set-row grid grid-cols-12 gap-1.5 items-center border border-[var(--line)] rounded-lg px-1 py-1 ${s.done?'done':''}"></div>`);
    row.appendChild(el(`<div class="col-span-1 text-center font-mono text-sm">${idx+1}</div>`));
    const wIn = el(`<input type="number" value="${toDisplayWeight(s.weight, unit)}" class="col-span-4 !py-1.5 text-sm">`);
    wIn.oninput = (e)=>{ s.weight=toStorageWeightKg(e.target.value, unit); queueSave(); };
    const rIn = el(`<input type="number" value="${s.reps}" class="col-span-3 !py-1.5 text-sm">`);
    rIn.oninput = (e)=>{ s.reps=e.target.value; queueSave(); };
    const pIn = el(`<input type="number" step="0.5" min="1" max="10" value="${s.rpe}" class="col-span-2 !py-1.5 text-sm">`);
    pIn.oninput = (e)=>{ s.rpe=e.target.value; queueSave(); };
    row.appendChild(wIn); row.appendChild(rIn); row.appendChild(pIn);
    const doneBtn = el(`<button class="col-span-2 font-mono text-xs py-1.5 rounded ${s.done?'bg-[var(--ok)] text-[#111]':'btn-ghost'}">${s.done?'✓':'Log'}</button>`);
    doneBtn.onclick = ()=>{
      s.done = !s.done;
      queueSave();
      if(s.done){ Timer.start(ex.restSec); }
      render();
    };
    row.appendChild(doneBtn);
    table.appendChild(row);
  });
  card.appendChild(table);
  return card;
}

/* ============================= REST TIMER ============================= */
const Timer = {
  remaining:0, interval:null,
  start(sec){
    clearInterval(this.interval);
    this.remaining = sec;
    $('timerBar').classList.remove('hidden');
    this.tick();
    this.interval = setInterval(()=>this.tick(), 1000);
  },
  tick(){
    if(this.remaining<=0){
      clearInterval(this.interval);
      $('timerDisplay').textContent = "GO";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      try{ new AudioContext(); }catch(e){}
      beep();
      setTimeout(()=> $('timerBar').classList.add('hidden'), 2500);
      return;
    }
    const m = Math.floor(this.remaining/60), s = this.remaining%60;
    $('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    this.remaining--;
  },
  adjust(delta){ this.remaining = Math.max(0,this.remaining+delta); },
  skip(){ this.remaining=0; this.tick(); }
};
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
  }catch(e){}
}

const FOOD_IDEAS = {
  protein:['chicken breast','salmon','greek yoghurt','egg whites','lean beef','tofu','cottage cheese','whey protein','turkey mince','white fish'],
  carb:['rice','oats','sweet potato','quinoa','wholemeal bread','banana','berries','potatoes','couscous'],
  fat:['olive oil','almonds','avocado','peanut butter','walnuts','olive oil dressing']
};
function suggestMeals(p){
  const dislikes = (p.dietaryDislikes||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  const restricted = (p.dietaryRestrictions||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  const filterOut = [...dislikes, ...restricted];
  function pick(list){ return list.filter(f=>!filterOut.some(d=>d && f.includes(d))); }
  const proteins = pick(FOOD_IDEAS.protein);
  const carbs = pick(FOOD_IDEAS.carb);
  const fats = pick(FOOD_IDEAS.fat);
  return {proteins, carbs, fats};
}

/* ============================= AI MEAL PLAN ============================= */
// How many eating occasions per day suits each goal (evidence-informed
// starting points: higher frequency helps hit larger calorie/protein targets
// and supports glycogen management for muscle gain/endurance; simpler, fewer
// meals often aids adherence for fat loss). Multiple goals blend by averaging.
const GOAL_MEAL_COUNT = {fatloss:4, muscle:6, strength:5, recomp:5, endurance:6};
// A compressed eating window naturally caps how many separate meals fit
// comfortably — these caps reflect common real-world practice for each
// protocol, not a hard physiological rule.
const IF_MEAL_CAP = {'14:10':4, '16:8':3, '18:6':2};
function mealsPerDayForProfile(profile){
  const goalsList = (Array.isArray(profile.goals) && profile.goals.length) ? profile.goals : (profile.goal ? [profile.goal] : ['recomp']);
  const avg = goalsList.reduce((s,g)=> s+(GOAL_MEAL_COUNT[g]||5), 0) / goalsList.length;
  let count = Math.round(avg);
  if(profile.intermittentFasting && profile.intermittentFasting.enabled){
    const cap = IF_MEAL_CAP[profile.intermittentFasting.protocol];
    if(cap) count = Math.min(count, cap);
  }
  return Math.max(2, Math.min(6, count));
}

// Which slots are used for a given number of daily meals, in order. Fewer
// meals drop snacks first, keeping breakfast/lunch/dinner wherever the
// eating window realistically allows them.
const SLOT_PLANS = {
  2: ['Lunch','Dinner'],
  3: ['Breakfast','Lunch','Dinner'],
  4: ['Breakfast','Lunch','Dinner','Snack'],
  5: ['Breakfast','Lunch','Snack','Dinner','Snack'],
  6: ['Breakfast','Snack','Lunch','Snack','Dinner','Snack']
};
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

function mealTemplateBlocked(tpl, restricted, disliked){
  const nameLower = tpl.name.toLowerCase();
  const ingredientNames = [tpl.proteinSource, tpl.carbSource, ...(tpl.fixedExtras||[]).map(e=>e.food)]
    .filter(Boolean).map(n=>n.toLowerCase());
  const allTerms = [...restricted, ...disliked];
  return allTerms.some(term=>{
    if(!term) return false;
    return nameLower.includes(term) || tpl.tags.some(tag=>tag===term) || ingredientNames.some(n=>n.includes(term));
  });
}

// Scales a meal template's protein/carb source grams to hit a target macro
// allocation as closely as realistic, then returns the ACTUAL resulting
// ingredients and macros (summed from real per-100g data) — close to target,
// not forced to match exactly, which is honest given whole foods rarely land
// on an exact number.
function scaleMealTemplate(tpl, targetCals, targetProtein, targetCarbs){
  const ingredients = [];
  let runningProtein = 0, runningCarbs = 0, runningFat = 0, runningCals = 0;

  (tpl.fixedExtras||[]).forEach(extra=>{
    const food = foodByName(extra.food);
    if(!food) return;
    const m = scaleMacros(food.per100, extra.grams);
    ingredients.push({item:extra.food, grams:Math.round(extra.grams), weightType:'cooked'});
    runningCals+=m.cals; runningProtein+=m.protein; runningCarbs+=m.carbs; runningFat+=m.fat;
  });
  const fixedProtein = runningProtein, fixedCarbs = runningCarbs;

  const proteinFood = tpl.proteinSource ? foodByName(tpl.proteinSource) : null;
  const carbFood = tpl.carbSource ? foodByName(tpl.carbSource) : null;
  const proteinPer100 = proteinFood ? (proteinFood.per100.protein||1) : 1;
  const carbsPer100 = carbFood ? (carbFood.per100.carbs||1) : 1;
  // Carb sources like oats carry meaningful protein of their own (~17g/100g) —
  // solving protein and carbs as two independent passes without correcting for
  // that caused a systematic protein overshoot. This does a first pass, then a
  // second pass that accounts for the carb source's own protein contribution.
  let proteinGrams = proteinFood ? Math.max(30, Math.min(400, ((targetProtein - fixedProtein) / proteinPer100) * 100)) : 0;
  if(tpl.isShake) proteinGrams = 30; // one standard scoop, not scaled
  let carbGrams = 0;
  if(carbFood){
    const proteinFromFirstPass = proteinFood ? scaleMacros(proteinFood.per100, proteinGrams).protein : 0;
    carbGrams = Math.max(20, Math.min(500, ((targetCarbs - fixedCarbs - (proteinFood?scaleMacros(proteinFood.per100,proteinGrams).carbs:0)) / carbsPer100) * 100));
    if(proteinFood && !tpl.isShake){
      const carbSourceProtein = scaleMacros(carbFood.per100, carbGrams).protein;
      proteinGrams = Math.max(30, Math.min(400, ((targetProtein - fixedProtein - carbSourceProtein) / proteinPer100) * 100));
    }
  }

  if(proteinFood){
    const m = scaleMacros(proteinFood.per100, proteinGrams);
    const weightType = /cooked|boiled/i.test(tpl.proteinSource) ? 'cooked' : (/powder|yoghurt|cheese/i.test(tpl.proteinSource) ? 'as prepared' : 'raw');
    ingredients.push({item:tpl.proteinSource, grams:Math.round(proteinGrams), weightType});
    runningCals+=m.cals; runningProtein+=m.protein; runningCarbs+=m.carbs; runningFat+=m.fat;
  }
  if(carbFood){
    const m = scaleMacros(carbFood.per100, carbGrams);
    const weightType = /cooked|boiled|rice|pasta|couscous|noodles/i.test(tpl.carbSource) ? 'cooked' : 'raw';
    ingredients.push({item:tpl.carbSource, grams:Math.round(carbGrams), weightType});
    runningCals+=m.cals; runningProtein+=m.protein; runningCarbs+=m.carbs; runningFat+=m.fat;
  }

  return {
    slot: tpl.slot, name: tpl.name, id: tpl.id, prepNote: tpl.prepNote,
    ingredients,
    macros:{calories:Math.round(runningCals), protein:fmt1(runningProtein), carbs:fmt1(runningCarbs), fat:fmt1(runningFat)}
  };
}

// Rule-based, evidence-informed supplement suggestions — no AI needed, since
// these recommendations follow well-established, stable guidance rather than
// anything requiring generative reasoning.
function recommendSupplementsLocal(profile){
  const goalsList = (Array.isArray(profile.goals) && profile.goals.length) ? profile.goals : (profile.goal ? [profile.goal] : []);
  const recs = [];
  if(goalsList.includes('strength') || goalsList.includes('muscle') || goalsList.includes('recomp')){
    recs.push({name:'Creatine monohydrate', dose:'3-5g daily, any time', rationale:'The most consistently evidence-backed supplement for strength and muscle gain, safe for long-term daily use.'});
  }
  recs.push({name:'Vitamin D3', dose:'400-1000 IU daily, especially autumn-winter', rationale:'UK sunlight exposure is often insufficient to maintain healthy levels year-round, per Public Health England guidance for the general population.'});
  recs.push({name:'Omega-3 (fish oil or algae-based)', dose:'1-2g combined EPA/DHA daily', rationale:'Supports cardiovascular and joint health, useful if oily fish is eaten less than twice a week.'});
  if(!profile.usesProteinShake){
    recs.push({name:'Whey or plant protein powder', dose:'As needed to close any gap to your daily protein target', rationale:'A practical way to hit protein targets if whole food alone falls short, not required if food already covers it.'});
  }
  return recs.slice(0,4);
}

function generateMealPlan(){
  state.mealPlan.status = 'loading'; render();
  // Computation is instant, but a brief timeout keeps the loading state
  // visible long enough to feel intentional rather than a flicker.
  setTimeout(()=>{
    try{
      const p = state.profile;
      const calKey = profileCalorieKey(p);
      const targets = state.targets[calKey];
      const mealsPerDay = mealsPerDayForProfile(p);
      const usesShake = !!p.usesProteinShake;
      const restricted = (p.dietaryRestrictions||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
      const disliked = (p.dietaryDislikes||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);

      const slots = SLOT_PLANS[mealsPerDay] || SLOT_PLANS[4];
      const byType = {};
      MEAL_TEMPLATES.forEach(t=>{
        if(t.isShake) return; // handled separately below, not part of the normal rotation
        if(mealTemplateBlocked(t, restricted, disliked)) return;
        (byType[t.slot] = byType[t.slot]||[]).push(t);
      });

      // If the client uses a shake, it fills exactly one snack slot per day with
      // its real fixed content (one scoop + milk) — not scaled to a target share,
      // since scaling a shake up/down to hit an arbitrary fraction isn't realistic.
      // Its actual macros are subtracted from the day's remaining budget up front,
      // so the OTHER meals share what's left rather than everything competing for
      // the same full-size targets and systematically overshooting.
      let shakeMeal = null;
      if(usesShake){
        const shakeTpl = MEAL_TEMPLATES.find(t=>t.isShake);
        shakeMeal = scaleMealTemplate(shakeTpl, 0, 0, 0);
        shakeMeal.slot = 'Snack'; shakeMeal.time = '';
      }
      const remainingCals = Math.max(0, targets.calories - (shakeMeal ? shakeMeal.macros.calories : 0));
      const remainingProtein = Math.max(0, targets.protein.g - (shakeMeal ? shakeMeal.macros.protein : 0));
      const remainingCarbs = Math.max(0, targets.carbs.g - (shakeMeal ? shakeMeal.macros.carbs : 0));

      // Weight each remaining slot's share of the (post-shake) daily targets:
      // mains get 3x a snack's share. The training-adjacent slot gets a modest
      // carb boost, per standard sports nutrition practice of timing carbs
      // around training. The slot the shake occupies is excluded from this
      // weighting since it's already accounted for above.
      const shakeSlotIndex = usesShake ? slots.map((s,idx)=>({s,idx})).filter(x=>x.s==='Snack')[0]?.idx : -1;
      const weights = slots.map((s,i)=> i===shakeSlotIndex ? 0 : (s==='Snack' ? 1 : 3));
      const totalWeight = weights.reduce((a,b)=>a+b,0) || 1;
      function slotForTrainingTime(tt){
        return tt==='PM' ? 'Dinner' : (tt==='Midday' ? 'Lunch' : 'Breakfast');
      }

      const days = [];
      const usedGrams = {}; // ingredient name -> total grams across the week, for the shopping list
      let snackOccurrence = 0;

      for(let d=0; d<7; d++){
        const dayName = DAY_NAMES[d];
        // Each day's own training time (which the client can set independently
        // per day) determines which meal gets the carb-timing boost that day —
        // a client training AM on Monday but PM on Tuesday gets genuinely
        // different meal structures on those two days, not one fixed pattern.
        const trainAdjacentSlot = slotForTrainingTime(trainingTimeForDay(p, dayName));
        const meals = [];
        snackOccurrence = 0;
        slots.forEach((slotType, i)=>{
          if(i===shakeSlotIndex && shakeMeal){
            const thisShake = JSON.parse(JSON.stringify(shakeMeal));
            meals.push(thisShake);
            thisShake.ingredients.forEach(ing=>{ usedGrams[ing.item] = (usedGrams[ing.item]||0) + ing.grams; });
            return;
          }
          let pool = byType[slotType] || [];
          if(pool.length===0) return;
          // Vary by both day AND which occurrence of this slot type within the
          // day, so e.g. two snack slots on the same day don't pick the same meal.
          const pickIndex = slotType==='Snack' ? (d + snackOccurrence) : d;
          if(slotType==='Snack') snackOccurrence++;
          const tpl = pool[pickIndex % pool.length];

          const calShare = remainingCals * (weights[i]/totalWeight);
          let carbShare = remainingCarbs * (weights[i]/totalWeight);
          if(slotType===trainAdjacentSlot){ carbShare *= 1.2; }
          const proteinShare = remainingProtein * (weights[i]/totalWeight);

          const meal = scaleMealTemplate(tpl, calShare, proteinShare, carbShare);
          meal.slot = slotType; meal.time = '';
          meals.push(meal);
          meal.ingredients.forEach(ing=>{
            usedGrams[ing.item] = (usedGrams[ing.item]||0) + ing.grams;
          });
        });
        days.push({day:DAY_NAMES[d], meals});
      }

      const shoppingList = Object.entries(usedGrams).map(([item, grams])=>{
        const kg = grams/1000;
        const pricePer100g = UK_PRICE_PER_100G[item] || 0.5;
        const cost = (grams/100) * pricePer100g;
        return {item, totalAmount: kg>=1 ? `${fmt1(kg)}kg` : `${Math.round(grams)}g`, estCostGBP: fmt1(cost)};
      }).sort((a,b)=> a.item.localeCompare(b.item));
      const totalEstimatedCostGBP = fmt1(shoppingList.reduce((s,i)=>s+i.estCostGBP,0));

      const ifNote = (p.intermittentFasting && p.intermittentFasting.enabled)
        ? `Meals are compressed to fit a ${p.intermittentFasting.protocol} eating window.`
        : 'Meals are spread across a normal waking day.';

      state.mealPlan = {
        status:'done',
        result:{
          mealsPerDay, eatingWindowNote: ifNote, days,
          batchPrepGuide:'Cook proteins and carbs in bulk 2x this week (e.g. Sunday and Wednesday) and refrigerate in portioned containers for up to 4 days; most cooked proteins and grains also freeze well for up to 3 months if you want to prep further ahead.',
          shoppingList, totalEstimatedCostGBP,
          supplements: recommendSupplementsLocal(p)
        },
        generatedAt: todayISO()
      };
    }catch(e){
      console.error('Meal plan generation failed:', e);
      state.mealPlan = {status:'error', result:null, generatedAt:null};
    }
    queueSave(); render();
  }, 400);
}

function mealTimingHTML(time){
  const common = `<p>Total daily protein and calorie targets matter far more than exact timing — but spreading protein across 3-5 meals (each ~0.3-0.4g/kg) optimizes muscle protein synthesis.</p>`;
  if(time==='AM') return common + `<p><b>Pre-workout (AM):</b> a small carb+protein snack 30-60 min before if training fasted feels hard (e.g. banana + yoghurt). <b>Post-workout:</b> your largest protein+carb meal of the day within 1-2 hours.</p>`;
  if(time==='Midday') return common + `<p><b>Pre-workout:</b> a balanced meal 2-3 hours before training. <b>Post-workout:</b> a protein+carb meal shortly after to refuel for the rest of the day.</p>`;
  return common + `<p><b>Pre-workout (PM):</b> your main carb+protein meal 2-3 hours before training. <b>Post-workout:</b> a moderate protein+carb meal; avoid an overly heavy meal right before sleep.</p>`;
}

  wrap.appendChild(el(`<p class="text-sm text-[var(--ink-2)] mb-6">Log today's food intake and see it stack against your macro targets.</p>`));

  const t = state.targets[profileCalorieKey(state.profile)];
  const todayFood = state.logs.food[todayISO()] || [];
  const totals = todayFood.reduce((a,f)=>({cals:a.cals+f.cals, protein:a.protein+f.protein, carbs:a.carbs+f.carbs, fat:a.fat+f.fat}), {cals:0,protein:0,carbs:0,fat:0});

  [['Calories', totals.cals, t.calories],['Protein', totals.protein, t.protein.g],['Carbs', totals.carbs, t.carbs.g],['Fat', totals.fat, t.fat.g]].forEach(([l,v,target])=>{

    track.appendChild(el(`<div class="progress-fill" style="width:${Math.min(100,v/target*100)}%; background:${exceeded ? '#FF2D2D' : 'var(--chalk)'};"></div>`));
    c.appendChild(track);
    sGrid.appendChild(c);
  });
  wrap.appendChild(summary);

  const addCard = el(`<div class="card p-4 mb-5"></div>`);
  addCard.appendChild(el(`<div class="label mb-2">Add Food</div>`));

  const list = el(`<div class="card p-4"></div>`);
  list.appendChild(el(`<div class="label mb-2">Today's Entries</div>`));
  if(todayFood.length===0){ list.appendChild(el(`<div class="text-sm text-[var(--ink-2)]">Nothing logged yet today.</div>`)); }
  todayFood.forEach((f,idx)=>{
    const row = el(`<div class="py-2 border-b border-[var(--line)] last:border-0"></div>`);
    if(editingFoodIndex===idx){
      row.appendChild(renderFoodEditRow(f, idx));

      const topRow = el(`<div class="flex justify-between items-center gap-2"></div>`);
      topRow.appendChild(el(`<div class="min-w-0"><div class="text-sm font-medium truncate">${f.name}</div><div class="text-xs font-mono text-[var(--ink-2)]">${f.cals}kcal · P${f.protein} C${f.carbs} F${f.fat}</div></div>`));

      editBtn.onclick = ()=>{ editingFoodIndex=idx; render(); };
