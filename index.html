    }
    list.appendChild(row);
  });
  wrap.appendChild(list);

  return wrap;
}

/* ---- Editing an already-logged food entry ---- */
let editingFoodIndex = null;
function renderFoodEditRow(f, idx){
  const box = el(`<div class="mt-2 p-3 rounded-lg border border-[var(--line)] bg-[var(--bg-2)]"></div>`);

  if(f.per100){
    // Entry came from search/scan — we know its per-100 rate, so editing the
    // amount just rescales cals/protein/carbs/fat rather than needing manual re-entry.
    box.appendChild(el(`<div class="font-medium text-sm mb-2">${f.baseName || f.name}</div>`));
    let selectedUnit = f.unit || 'g';
    const row = el(`<div class="flex items-center gap-2 mb-2"></div>`);
    const qtyInput = el(`<input type="number" value="${f.qty}" class="w-24">`);
    row.appendChild(qtyInput);
    const unitToggle = el(`<div class="flex gap-1 text-xs"></div>`);
    ['g','ml'].forEach(u=>{
      const b = el(`<button type="button" class="px-2.5 py-1.5 rounded ${selectedUnit===u?'btn-chalk':'btn-ghost'}">${u}</button>`);
      b.onclick = ()=>{
        selectedUnit = u;
        Array.from(unitToggle.children).forEach(child=>{
          child.className = `px-2.5 py-1.5 rounded ${child.textContent===u?'btn-chalk':'btn-ghost'}`;
        });
      };
      unitToggle.appendChild(b);
    });
    row.appendChild(unitToggle);
    box.appendChild(row);
    const preview = el(`<div class="font-mono text-xs text-[var(--ink-1)] mb-3"></div>`);
    function updatePreview(){
      const qty = parseFloat(qtyInput.value)||0;
      const m = scaleMacros(f.per100, qty);
      preview.textContent = `${Math.round(m.cals)} kcal · P${fmt1(m.protein)}g C${fmt1(m.carbs)}g F${fmt1(m.fat)}g`;
    }
    qtyInput.oninput = updatePreview;
    updatePreview();
    box.appendChild(preview);
    const btnRow = el(`<div class="flex gap-2"></div>`);
    const saveBtn = el(`<button class="btn btn-chalk px-4 py-2 rounded-lg text-xs flex-1">Save</button>`);
    saveBtn.onclick = ()=>{
      const qty = parseFloat(qtyInput.value)||0;
      const unit = selectedUnit;
      const m = scaleMacros(f.per100, qty);
      f.qty = qty;
      f.unit = unit;
      f.name = `${f.baseName} (${qty}${unit})`;
      f.cals = Math.round(m.cals);
      f.protein = fmt1(m.protein);
      f.carbs = fmt1(m.carbs);
      f.fat = fmt1(m.fat);
      editingFoodIndex = null;
      queueSave(); render();
    };
    const cancelBtn = el(`<button class="btn btn-ghost px-4 py-2 rounded-lg text-xs">Cancel</button>`);
    cancelBtn.onclick = ()=>{ editingFoodIndex=null; render(); };
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
    box.appendChild(btnRow);
  } else {
    // Manually-entered item — no per-100 rate to scale from, so edit the numbers directly.
    box.appendChild(el(`<div class="text-xs text-[var(--ink-2)] mb-2">Manually entered — edit values directly</div>`));
    const form = el(`<div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-3"></div>`);
    const nameIn = el(`<input value="${f.name}" placeholder="Food name" class="sm:col-span-1 col-span-2">`);
    const calIn = el(`<input type="number" value="${f.cals}" placeholder="kcal">`);
    const pIn = el(`<input type="number" value="${f.protein}" placeholder="Protein g">`);
    const cIn = el(`<input type="number" value="${f.carbs}" placeholder="Carbs g">`);
    const fIn = el(`<input type="number" value="${f.fat}" placeholder="Fat g">`);
    form.appendChild(nameIn); form.appendChild(calIn); form.appendChild(pIn); form.appendChild(cIn); form.appendChild(fIn);
    box.appendChild(form);
    const btnRow = el(`<div class="flex gap-2"></div>`);
    const saveBtn = el(`<button class="btn btn-chalk px-4 py-2 rounded-lg text-xs flex-1">Save</button>`);
    saveBtn.onclick = ()=>{
      f.name = nameIn.value || f.name;
      f.cals = parseFloat(calIn.value)||0;
      f.protein = parseFloat(pIn.value)||0;
      f.carbs = parseFloat(cIn.value)||0;
      f.fat = parseFloat(fIn.value)||0;
      editingFoodIndex = null;
      queueSave(); render();
    };
    const cancelBtn = el(`<button class="btn btn-ghost px-4 py-2 rounded-lg text-xs">Cancel</button>`);
    cancelBtn.onclick = ()=>{ editingFoodIndex=null; render(); };
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
    box.appendChild(btnRow);
  }
  return box;
}

/* ---- Search panel (live food database + offline fallback) ---- */
function renderFoodSearchPanel(){
  const wrap = el(`<div></div>`);
  const searchInput = el(`<input placeholder="Search a food e.g. chicken breast" value="${state.foodSearch.query||''}">`);
  const resultsBox = el(`<div class="mt-2 space-y-1 max-h-56 overflow-y-auto"></div>`);
  let debounceT;
  searchInput.oninput = (e)=>{
    state.foodSearch.query = e.target.value;
    clearTimeout(debounceT);
    debounceT = setTimeout(()=> doFoodSearch(state.foodSearch.query, resultsBox), 400);
  };
  wrap.appendChild(searchInput);
  wrap.appendChild(resultsBox);
  if(state.foodSearch.results && state.foodSearch.results.length){
    populateResultsBox(resultsBox, state.foodSearch.results);
  }
  const panelHolder = el(`<div></div>`);
  wrap.appendChild(panelHolder);
  if(state.foodSearch.selected){ panelHolder.appendChild(renderQtyPanel()); }

async function doFoodSearch(query, resultsBox){
  if(!query || query.trim().length<2){ resultsBox.innerHTML=''; state.foodSearch.results=[]; return; }
  resultsBox.innerHTML = `<div class="text-xs text-[var(--ink-2)] py-2">Searching…</div>`;
  let results = [];
  let usedFallback = false;
  try{
    const res = await fetch(`https://uk.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=8&tagtype_0=countries&tag_contains_0=contains&tag_0=united-kingdom`);
    const data = await res.json();
    results = (data.products||[])
      .filter(p=>p.product_name && p.nutriments && p.nutriments['energy-kcal_100g']!=null)
      .slice(0,8)
      .map(p=>({
        name:p.product_name,
        brand:p.brands ? p.brands.split(',')[0].trim() : '',
        per100:{
          cals:p.nutriments['energy-kcal_100g']||0,
          protein:p.nutriments['proteins_100g']||0,
          carbs:p.nutriments['carbohydrates_100g']||0,
          fat:p.nutriments['fat_100g']||0
        }
      }));
  }catch(e){ results = []; }
  if(results.length===0){
    usedFallback = true;
    const q = query.toLowerCase();
    results = COMMON_FOODS.filter(f=>f.name.toLowerCase().includes(q)).slice(0,8);
  }
  state.foodSearch.results = results;
  state.foodSearch.usedFallback = usedFallback;
  populateResultsBox(resultsBox, results, usedFallback);

async function openBarcodeScanner(){
  if($('scanModal')) return;
  const overlay = el(`
    <div id="scanModal" class="fixed inset-0 z-[75] bg-black/85 flex items-center justify-center px-4">
      <div class="card p-4 max-w-sm w-full">
        <div class="label mb-2">Point camera at barcode</div>
        <video id="scanVideo" class="w-full rounded-lg bg-black mb-3" playsinline autoplay muted></video>
        <div id="scanStatus" class="text-xs text-[var(--ink-2)] mb-3">Starting camera…</div>
        <button id="scanCloseBtn" class="btn btn-ghost w-full py-2 rounded-lg">Cancel</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const video = $('scanVideo');
  const status = $('scanStatus');
  let stream, scanRAF;
  const closeScanner = ()=>{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(scanRAF) cancelAnimationFrame(scanRAF);
    overlay.remove();
  };
  $('scanCloseBtn').onclick = closeScanner;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream;
  }catch(e){
    status.textContent = "Camera unavailable — enter the barcode number manually instead.";
    return;
  }
  if(!('BarcodeDetector' in window)){
    status.textContent = "This browser can't auto-scan — enter the barcode number manually instead.";
    return;
  }
  let detector;
  try{ detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }
  catch(e){ status.textContent = "Scanner unavailable — enter the barcode number manually instead."; return; }
  const scanLoop = async ()=>{
    try{
      const codes = await detector.detect(video);
      if(codes.length>0){
        const code = codes[0].rawValue;
        closeScanner();
        lookupBarcode(code);
        return;
      }
    }catch(e){}
    scanRAF = requestAnimationFrame(scanLoop);
  };
  status.textContent = 'Scanning…';
  scanRAF = requestAnimationFrame(scanLoop);
}
async function lookupBarcode(code){
  if(!code) return;
  state.foodSearch.scanError = null;
  try{
    const res = await fetch(`https://uk.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
    const data = await res.json();
    if(data.status===1 && data.product){
      const n = data.product.nutriments || {};
      state.foodSearch.selected = {
        name: data.product.product_name || 'Unknown product',
        brand: data.product.brands ? data.product.brands.split(',')[0].trim() : '',
        per100:{
          cals:n['energy-kcal_100g']||0,
          protein:n['proteins_100g']||0,
          carbs:n['carbohydrates_100g']||0,
          fat:n['fat_100g']||0
        }
      };
      state.foodSearch.qty = 100;
    } else {
      state.foodSearch.scanError = 'Product not found — try search or manual entry.';
    }
  }catch(e){
    state.foodSearch.scanError = 'Lookup failed — check your connection and try again.';
  }
  render();
}

let chartInstances = [];
function renderProgress(){
  chartInstances.forEach(c=>c.destroy());
  chartInstances = [];
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h2 class="font-display text-2xl font-bold mb-1">Progress</h2>`));
  wrap.appendChild(el(`<p class="text-sm text-[var(--ink-2)] mb-6">Weekly trends across your logged sessions — top weight per session confirms progressive overload.</p>`));

  // bodyweight chart
  if(state.logs.bodyweight.length>0){
    const sortedForLatest = [...state.logs.bodyweight].sort((a,b)=>a.date<b.date?-1:1);
    const latest = sortedForLatest[sortedForLatest.length-1];
    const latestStone = kgToStone(latest.weightKg);
    const bwCard = el(`<div class="card p-4 mb-5"><div class="flex justify-between items-baseline mb-2"><div class="label">Body Weight (kg)</div><div class="font-mono text-xs text-[var(--ink-2)]">latest: ${latestStone.st}st ${latestStone.lb}lb</div></div><canvas height="90"></canvas></div>`);
    wrap.appendChild(bwCard);
    setTimeout(()=>{
      const sorted = [...state.logs.bodyweight].sort((a,b)=>a.date<b.date?-1:1);
      const ctx = bwCard.querySelector('canvas').getContext('2d');
      chartInstances.push(new Chart(ctx, {
        type:'line',
        data:{labels:sorted.map(e=>e.date), datasets:[{data:sorted.map(e=>e.weightKg), borderColor:currentTheme().chalk, backgroundColor:`rgba(${currentTheme().rgb},0.15)`, fill:true, tension:0.3}]},
        options: chartOpts()
      }));
    },0);
  }

  // per-exercise charts
  const exNames = new Set();
  Object.values(state.logs.workouts).forEach(w=> Object.keys(w.exercises).forEach(n=>exNames.add(n)));
  if(exNames.size===0){
    wrap.appendChild(el(`<div class="card p-4 text-sm text-[var(--ink-2)]">Log a few workouts to see exercise progress charts here.</div>`));
  }
  exNames.forEach(name=>{
    const sessions = Object.values(state.logs.workouts)
      .filter(w=>w.exercises[name] && w.exercises[name].some(s=>s.done))
      .sort((a,b)=>a.date<b.date?-1:1);
    if(sessions.length===0) return;
    const card = el(`<div class="card p-4 mb-5"><div class="label mb-2">${name}</div><canvas height="90"></canvas></div>`);
    wrap.appendChild(card);
    setTimeout(()=>{
      const ctx = card.querySelector('canvas').getContext('2d');
      const topWeights = sessions.map(s=>{
        const done = s.exercises[name].filter(x=>x.done && x.weight);
        return done.length ? Math.max(...done.map(x=>parseFloat(x.weight))) : 0;
      });
      const totalReps = sessions.map(s=> s.exercises[name].filter(x=>x.done).reduce((a,x)=>a+(parseInt(x.reps)||0),0));
      chartInstances.push(new Chart(ctx, {
        type:'line',
        data:{labels:sessions.map(s=>s.date), datasets:[
          {label:'Top set weight (kg)', data:topWeights, borderColor:currentTheme().chalk, backgroundColor:`rgba(${currentTheme().rgb},0.12)`, fill:true, tension:0.3, yAxisID:'y'},
          {label:'Total reps', data:totalReps, borderColor:'#5B6B7C', tension:0.3, yAxisID:'y1'}
        ]},
        options: chartOpts(true)
      }));
    },0);
  });

  return wrap;
}
function chartOpts(dual=false){
  const base = {
    responsive:true,
    plugins:{legend:{labels:{color:'#B8B7B0', font:{family:'Inter'}}}},
    scales:{
      x:{ticks:{color:'#7C7B76'}, grid:{color:'#232326'}},
      y:{ticks:{color:'#7C7B76'}, grid:{color:'#232326'}}
    }
  };
  if(dual){ base.scales.y1 = {position:'right', ticks:{color:'#7C7B76'}, grid:{display:false}}; }
  return base;
}

function renderBaselineAnalysisCard(r){
  const card = el(`<div class="card p-5 mb-6"></div>`);
  card.appendChild(el(`<div class="label mb-3">Comparison Analysis <span class="text-[var(--ink-2)] normal-case">(visual estimate — not a clinical measurement)</span></div>`));

  const cols = el(`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4"></div>`);
  const you = el(`<div></div>`);
  you.appendChild(el(`<div class="label mb-1" style="color:var(--chalk);">You Now</div>`));
  you.appendChild(el(`<p class="text-sm text-[var(--ink-1)]">${r.clientAppraisal||''}</p>`));
  const goal = el(`<div></div>`);
  goal.appendChild(el(`<div class="label mb-1">Your Goal</div>`));
  goal.appendChild(el(`<p class="text-sm text-[var(--ink-1)]">${r.targetAppraisal||''}</p>`));
  cols.appendChild(you); cols.appendChild(goal);
  card.appendChild(cols);

  if(r.keyDifferences){
    card.appendChild(el(`<div class="label mb-1">Key Differences</div>`));
    card.appendChild(el(`<p class="text-sm text-[var(--ink-1)] mb-3">${r.keyDifferences}</p>`));
  }
  if(r.nutritionRecommendation){
    card.appendChild(el(`<div class="label mb-1">Nutrition Implication</div>`));
    card.appendChild(el(`<p class="text-sm text-[var(--ink-1)] mb-3">${r.nutritionRecommendation}</p>`));
  }
  if(r.trainingFocus){
    card.appendChild(el(`<div class="label mb-1">Training Focus</div>`));
    card.appendChild(el(`<p class="text-sm text-[var(--ink-1)] mb-3">${r.trainingFocus}</p>`));
  }
  if(r.timeframe){
    card.appendChild(el(`<div class="label mb-1">Realistic Timeframe</div>`));
    card.appendChild(el(`<p class="text-sm text-[var(--ink-1)]">${r.timeframe}</p>`));
  }
  if(session.role==='coach' && session.viewingAsCoach && typeof r.suggestedCalorieAdjustment==='number' && r.suggestedCalorieAdjustment!==0){
    const applyBtn = el(`<button class="btn btn-ghost px-4 py-2 rounded-lg text-xs mt-3">Apply ${r.suggestedCalorieAdjustment>0?'+':''}${r.suggestedCalorieAdjustment}kcal/day to targets</button>`);
    applyBtn.onclick = ()=> applyNutritionSuggestion({amount:r.suggestedCalorieAdjustment});
    card.appendChild(applyBtn);
  }
  return card;
}

let newCheckinDraft = {front:null, side:null, rear:null, measurements:{chest:'', waist:'', thigh:'', bicep:'', unit:'cm'}};

// Compares a check-in's measurements against the client's baseline (from
// onboarding), converting units as needed, and renders the deltas — this is
// what lets a client see "waist -2cm since baseline" alongside their photos.
function renderMeasurementDeltas(checkinMeasurements, baselineMeasurements){
  if(!checkinMeasurements) return null;
  const hasAny = ['chest','waist','thigh','bicep'].some(k=>checkinMeasurements[k]);
  if(!hasAny) return null;
  const displayUnit = checkinMeasurements.unit || 'cm';
  const row = el(`<div class="mb-3 p-2 rounded-lg bg-[var(--bg-2)]"></div>`);
  row.appendChild(el(`<div class="label mb-1">Measurements</div>`));
  const items = el(`<div class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs font-mono"></div>`);
  [['chest','Chest'],['waist','Waist'],['thigh','Thigh'],['bicep','Bicep']].forEach(([key,label])=>{
    const val = checkinMeasurements[key];
    if(!val) return;
    const valCm = measurementToCm(val, displayUnit);
    const displayVal = measurementFromCm(valCm, displayUnit);
    let deltaText = '';
    if(baselineMeasurements && baselineMeasurements[key]){
      const baseCm = measurementToCm(baselineMeasurements[key], baselineMeasurements.unit||'cm');
      if(baseCm!=null){
        const deltaCm = fmt1(valCm - baseCm);
        const deltaDisplay = measurementFromCm(Math.abs(deltaCm), displayUnit);
        const sign = deltaCm > 0 ? '+' : (deltaCm < 0 ? '−' : '');
        const color = deltaCm===0 ? 'var(--ink-2)' : 'var(--ink-1)';
        deltaText = ` <span style="color:${color};">(${sign}${deltaDisplay}${displayUnit})</span>`;
      }
    }
    items.appendChild(el(`<div class="text-[var(--ink-1)]">${label}: ${displayVal}${displayUnit}${deltaText}</div>`));
  });
  row.appendChild(items);
  return row;
}

async function runBaselineAnalysis(){
  state.analysis.baseline.status='loading'; render();
  try{
    const content = [];
    const addImg = (label, dataUrl)=>{
      if(!dataUrl) return;
      content.push({type:'text', text:label});
      content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data: dataUrl.split(',')[1]}});
    };
    addImg('Client — front view:', state.photos.baseline.front);
    addImg('Client — side view:', state.photos.baseline.side);
    addImg('Client — rear view:', state.photos.baseline.rear);
    addImg('Goal physique — front view:', state.photos.target.front);
    addImg('Goal physique — side view:', state.photos.target.side);
    addImg('Goal physique — rear view:', state.photos.target.rear);

    content.push({type:'text', text:`
You are a supportive, evidence-based physique coach. The first set of photos is the client themselves; the second set is their stated goal physique (a different person they're using as a visual reference). Give an honest, kind, non-judgmental comparison for training-and-nutrition planning purposes only — never a clinical or diagnostic measurement, and never body-shaming.
Client's stated goal(s): "${goalsLabel(state.profile.goals) || state.profile.goal}". Gender: ${state.profile.gender}.
Respond ONLY with strict JSON, no markdown, in this exact shape:
{
 "clientAppraisal":"2-3 sentences on the client's current frame, muscle development, approximate body fat range, and posture",
 "targetAppraisal":"2-3 sentences on the same dimensions (frame, muscle, approximate body fat range, posture) for the goal physique",
 "keyDifferences":"2-3 sentences on the main differences between the two, framed constructively",
 "nutritionRecommendation":"1-2 sentences on how this gap should shape the calorie/macro approach (e.g. more of a lean bulk vs a longer cut, higher protein emphasis, etc)",
 "suggestedCalorieAdjustment": a small integer like -150, -100, 0, 100, or 150 representing a daily kcal nudge to targets given the gap (use 0 if the current plan already fits well),
 "trainingFocus":"1-2 sentences on which muscle groups or movement patterns the program should emphasize to close the gap",
 "timeframe":"1 sentence realistic timeframe estimate assuming consistent training and correct nutrition"
}
Keep total output under 180 words. Do not mention weight loss drugs or supplements. Be encouraging and evidence-based throughout.`});

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1200, messages:[{role:'user', content}]})
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    let clean = (textBlock ? textBlock.text : '{}').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    state.analysis.baseline = {status:'done', result:parsed};
  }catch(e){
    console.error(e);
    state.analysis.baseline = {status:'error', result:null};
  }
  queueSave(); render();
}

async function submitCheckin(){
  const id = genCode(8);
  const checkin = {id, date:todayISO(), front:newCheckinDraft.front, side:newCheckinDraft.side, rear:newCheckinDraft.rear, measurements: Object.assign({}, newCheckinDraft.measurements)};
  state.photos.checkins = state.photos.checkins || [];
  state.photos.checkins.push(checkin);
  newCheckinDraft = {front:null, side:null, rear:null, measurements:{chest:'', waist:'', thigh:'', bicep:'', unit:'cm'}};
  queueSave(); render();
  await runCheckinAnalysis(checkin);
}

async function runCheckinAnalysis(checkin){
  state.analysis.checkins[checkin.id] = {status:'loading', result:null};
  render();
  try{
    const content = [];
    const addImg = (label, dataUrl)=>{
      if(!dataUrl) return;
      content.push({type:'text', text:label});
      content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data: dataUrl.split(',')[1]}});
    };
    addImg('Baseline — front view:', state.photos.baseline.front);
    addImg('Baseline — side view:', state.photos.baseline.side);
    addImg('Baseline — rear view:', state.photos.baseline.rear);
    addImg('New check-in — front view:', checkin.front);
    addImg('New check-in — side view:', checkin.side);
    addImg('New check-in — rear view:', checkin.rear);

    content.push({type:'text', text:`
You are a supportive, evidence-based physique coach. The first set of photos is the client's original baseline; the second set is a new progress check-in of the same client. Client's stated goal(s): "${goalsLabel(state.profile.goals) || state.profile.goal}".
Give an honest, kind, non-judgmental read on whether visible physical change is apparent between the two sets — never a clinical measurement, never body-shaming.
Respond ONLY with strict JSON, no markdown, in this exact shape:
{
 "changeDetected": true or false — whether meaningful visible change toward the goal is apparent,
 "appraisal":"2-3 sentences describing what has or hasn't visibly changed (muscle, leanness, posture, etc)",
 "recommendation":"1 sentence — if changeDetected is true, a short encouraging note; if false, a note that the training and nutrition plan may be worth reviewing since progress isn't yet visible"
}
Keep total output under 100 words. Be encouraging and evidence-based.`});

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:800, messages:[{role:'user', content}]})
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    let clean = (textBlock ? textBlock.text : '{}').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    state.analysis.checkins[checkin.id] = {status:'done', result:parsed};
    if(parsed.changeDetected===false){
      addNotification(
        'Progress check-in: no visible change yet',
        `Your ${checkin.date} check-in didn't show a clear visible change toward your goal. It may be worth reviewing your nutrition targets and training program together.`
      );
    }
  }catch(e){
    console.error(e);
    state.analysis.checkins[checkin.id] = {status:'error', result:null};
  }
  queueSave(); render();
}

// content stops its clicks from reaching here, so this only fires for genuine

// bug this fixes: the panel could otherwise stay open indefinitely and
// silently sit on top of controls on the right side of the screen, like the
